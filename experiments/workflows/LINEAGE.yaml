# Workflow lineage — the source for ancestry, status and old names.
#
# This file is the single truth about category, arm, version, parent
# and status of a workflow. ALIASES.json, PATHS.json and the inventory table
# of the snapshot reports are generated from it — never updated by hand.
#   Regenerate + check:  experiments/workflow-lineage.py --check --emit
#
# ---------------------------------------------------------------------------
# Naming convention
# ---------------------------------------------------------------------------
#   <prefix>-<arm>-v<MAJOR>[.<N>…][-<slug>]-<harness>
#
# Prefix       exact- | baseline- | external-, must match the category.
#              The folder path does not travel: metrics.json, run folder names,
#              runs.csv and findings tables carry only this leaf name.
#              That is why the name carries the category, not just the folder.
#
# Arm          What the workflow PERMANENTLY IS (hybrid, single-context, sol …).
# Slug         What changed IN THIS STEP (end-refactor, no-pep …).
#              Hence "end-refactor-only" is an arm (refactor only at the end, no
#              cycle), "end-refactor" a slug (this step adds it)
#              and "no-end-refactor" a slug (this step removes it).
#              Omitted only for v1 of an arm, where the arm name already says it all.
#
# Version      MAJOR increases ONLY when this variant was built upon.
#              An arm that was never the base of a next step stays a
#              .N branch — even if it measured well. The number is thus
#              development depth, not quality and not a recommendation.
#              Which workflow is the default is stated exclusively in
#              research/workflow-dev/model-recommendation-matrix.md — the default
#              forks per model and also runs backwards.
#
# Harness      cc | oc | pi | cursor. Always explicit, never implicit.
#
# ---------------------------------------------------------------------------
# Folders
# ---------------------------------------------------------------------------
#   exact-coding/   the four EXACT Coding building blocks (test-list, red, green,
#                   refactor) exist as separate commands/skills/agents.
#                   That is exactly what --check verifies; it is no matter of taste.
#     opus/         built on Claude Code with Sonnet/Opus
#     sol/          built on pi with SOL
#
#     CAUTION: the folder name says WHERE THE LINE WAS BUILT, not where it
#     runs. exact-hybrid-v6-lab-split-pi lives under opus/, exact-sol-v1-cc
#     under sol/. Both are correct. Content axes (APP vs Four Rules,
#     prediction form vs prose) do NOT work as folders: every single one has
#     been crossed on purpose by some RQ — exact-sol-v1.2-app-pi carries
#     APP into the Sol line. Only the origin can no longer become wrong.
#
#   baselines/      comparison workflows WITHOUT EXACT Coding building blocks.
#   external/       vendored third-party skills. Version slot = vendoring date from
#                   the git history, because LICENSE.upstream names no upstream
#                   version. "v1/v2" would claim authorship of third-party code.
#   _archive/       mirrors the tree. Exclusively status: discarded.
#
# ---------------------------------------------------------------------------
# status
# ---------------------------------------------------------------------------
#   trunk       base that was built upon
#   branch      branch; answers an RQ, was not built upon
#   superseded  replaced by a trunk successor, stays reproducible
#   discarded   rejected — lives under _archive/, aggregate-by-query aborts
#   vendored    third-party code, no own development line
#
# ---------------------------------------------------------------------------
# description vs. note
# ---------------------------------------------------------------------------
#   description  Optional prose for outsiders, shown on the results site: what
#                kind of workflow this is, its arm and what sets it apart.
#                No RQ ids, no metric values. Long text may switch the entry
#                to block style.
#                Write it so it stays true as the lab moves on: no "default",
#                "current", "latest" or other standing — that is status: and
#                model-recommendation-matrix.md. A workflow dir is frozen, so a
#                description of what it does never has to change.
#                Name the building blocks (test list, dimension cross-check,
#                refactoring rules, context architecture); do not explain
#                established methods such as Red-Green-Refactor or Predictive TDD.
#   note         Lab-facing remark (driver RQ, measured effect, caveat).
#                Never shown on the results site.
#
# parent is mandatory except for roots. If the parent's arm differs from the
# own arm, that is an arm jump: --check reports it as such instead of
# silently waving it through. See exact-single-context-v3-no-subagent-cc.

categories:

  exact-coding/opus:
    prefix: exact
    origin: {harness: claude-code, model: sonnet/opus}
    workflows:
      exact-subagents-v1-cc:                      {arm: subagents,      version: "1",     harness: cc,     parent: null,                                   status: superseded, alias: [v4-exact-subagents],
        description: "An EXACT Coding workflow for Claude Code (arm: subagents). The main context
          only orchestrates: test list, Red, Green and Refactor each run in their own isolated
          subagent with a fresh context, and get the file paths and current state from the
          orchestrator. The test list is limited to base functionality and not cross-checked. Red
          predicts compilation and runtime failures, and Refactor must attempt an improvement every
          cycle under the Four Rules of Simple Design and APP mass."}
      exact-subagents-v2-testlist-fix-cc:         {arm: subagents,      version: "2",     harness: cc,     parent: exact-subagents-v1-cc,                  status: trunk,      alias: [v4.1-testlist-scope-fix],
        description: "A variant of exact-subagents-v1 (arm: subagents) that changes the test list:
          it covers every rule, example and clarifying question in the specification, with expected
          values in each description, instead of base functionality only. It also removes the generic
          project-convention sections (hexagonal architecture, named exports, arrow functions) from
          the phase subagents. Every phase stays isolated in its own subagent, and the refactoring
          rules are unchanged."}
      exact-subagents-v2-testlist-fix-pi:         {arm: subagents,      version: "2",     harness: pi,     parent: exact-subagents-v2-testlist-fix-cc,     status: trunk,      alias: [v4.1-testlist-scope-fix-pi], port_of: exact-subagents-v2-testlist-fix-cc}

      exact-single-context-v1-cc:                 {arm: single-context, version: "1",     harness: cc,     parent: null,                                   status: superseded, alias: [v5-exact-single-context],
        description: "An EXACT Coding workflow for Claude Code (arm: single-context). It starts with
          a short, inactive test list limited to base functionality, ordered simple to complex and not
          cross-checked, then works through it one test at a time. Red predicts the compilation
          failure and then the runtime failure before each test run. Refactor must attempt at least
          one improvement per cycle, using the Four Rules of Simple Design and APP mass. All four
          phases are slash commands running in one shared context, without subagents."}
      exact-single-context-v2-testlist-fix-cc:    {arm: single-context, version: "2",     harness: cc,     parent: exact-single-context-v1-cc,             status: trunk,      alias: [v5.1-testlist-scope-fix],
        description: "A variant of exact-single-context-v1 (arm: single-context) that changes one
          thing: the test list covers every rule, example and clarifying question in the specification
          instead of base functionality only. Each test description carries the expected value, and
          the finished list is reviewed against the spec. The phase commands are reworded and
          expanded, but the phase structure, the shared context and the refactoring rules are
          unchanged."}
      exact-single-context-v2-testlist-fix-oc:    {arm: single-context, version: "2",     harness: oc,     parent: exact-single-context-v2-testlist-fix-cc, status: trunk,     alias: [v5.1-testlist-scope-fix-oc], port_of: exact-single-context-v2-testlist-fix-cc,
        description: "The OpenCode port of exact-single-context-v2-testlist-fix (arm:
          single-context). Same method and content as the Claude Code version; only the packaging
          differs: OpenCode skills and an AGENTS.md instead of slash commands and rules, plain-text
          markers instead of emoji, and the subagent (task) tool disabled."}
      exact-single-context-v2-testlist-fix-pi:    {arm: single-context, version: "2",     harness: pi,     parent: exact-single-context-v2-testlist-fix-cc, status: trunk,     alias: [v5.1-testlist-scope-fix-pi], port_of: exact-single-context-v2-testlist-fix-cc}
      exact-single-context-v3-no-subagent-cc:     {arm: single-context, version: "3",     harness: cc,     parent: exact-hybrid-v8-no-end-refactor-cc,     status: branch,     alias: [v5.2-no-subagent-cc], note: "Arm jump: the parent is the hybrid arm. Minimal workflow that is still EXACT Coding — all four building blocks, shared context, no isolated subagent. RQ-1.15 F-1.4 measures it at least as good as exact-hybrid-v8.",
        description: "An EXACT Coding workflow for Claude Code (arm: single-context). It starts with
          a complete, inactive test list covering every rule, example and clarifying question in the
          specification, not cross-checked against independent dimensions, then runs
          Red–Green–Refactor one test at a time with failure predictions in Red. Each cycle must
          attempt a refactoring under the Four Rules of Simple Design; APP mass only breaks ties and
          never outranks intent. All phases are skills in one shared context, with no subagents and no
          final whole-codebase refactoring pass."}

      exact-hybrid-v1-cc:                         {arm: hybrid,         version: "1",     harness: cc,     parent: null,                                   status: superseded, alias: [v6-hybrid],
        description: "An EXACT Coding workflow for Claude Code (arm: hybrid). It starts with a
          short, inactive test list that covers base functionality only and leaves out edge cases and
          advanced features; the list is not cross-checked. Test list, Red (with compile and runtime
          predictions) and Green run as slash-command skills in one shared main context. Each Refactor
          runs in an isolated subagent that checks naming first, applies the Four Rules of Simple
          Design in priority order and compares APP mass before and after."}
      exact-hybrid-v2-testlist-fix-cc:            {arm: hybrid,         version: "2",     harness: cc,     parent: exact-hybrid-v1-cc,                     status: superseded, alias: [v6.1-hybrid-testlist-scope-fix], note: "Former correctness-oriented Opus default; replaced by exact-ptdd-v1-cc as a much cheaper universal default. Remains a reproducible decomposition reference.",
        description: "A variant of exact-hybrid-v1-cc (arm: hybrid) whose main change is the test
          list: it is derived from the whole specification instead of base functionality only. Every
          rule, every example and every clarifying question gets at least one inactive test, with the
          expected value in its description. It is ordered from single rules to combinations and
          multi-step scenarios, and it is not cross-checked. In addition, the refactoring subagent
          loses its generic project-standards section (TypeScript conventions, hexagonal
          architecture, build commands)."}
      exact-hybrid-v2-testlist-fix-pi:            {arm: hybrid,         version: "2",     harness: pi,     parent: exact-hybrid-v2-testlist-fix-cc,        status: trunk,      alias: [v6.1-hybrid-testlist-scope-fix-pi], port_of: exact-hybrid-v2-testlist-fix-cc}
      exact-hybrid-v2-testlist-fix-oc:            {arm: hybrid,         version: "2",     harness: oc,     parent: exact-hybrid-v2-testlist-fix-cc,        status: trunk,      alias: [], port_of: exact-hybrid-v2-testlist-fix-cc, note: "Port 2026-09-13 for the exact-coding-baseline export; mechanics from exact-hybrid-v6-lab-split-oc, content from cc/pi. No end-refactor."}
      exact-hybrid-v2-testlist-fix-cursor:        {arm: hybrid,         version: "2",     harness: cursor, parent: exact-hybrid-v2-testlist-fix-cc,        status: trunk,      alias: [], port_of: exact-hybrid-v2-testlist-fix-cc, note: "Port 2026-09-13 for the exact-coding-baseline export; mechanics from exact-hybrid-v6-lab-split-cursor, content from cc/pi. No end-refactor."}
      exact-hybrid-v2.1-no-pep-cc:                {arm: hybrid,         version: "2.1",   harness: cc,     parent: exact-hybrid-v2-testlist-fix-cc,        status: branch,     alias: [v6.1-no-pep]}
      exact-hybrid-v2.2-no-emoji-cc:              {arm: hybrid,         version: "2.2",   harness: cc,     parent: exact-hybrid-v2-testlist-fix-cc,        status: branch,     alias: [v6.1-no-emoji]}
      exact-hybrid-v2.3-no-pep-no-emoji-cc:       {arm: hybrid,         version: "2.3",   harness: cc,     parent: exact-hybrid-v2-testlist-fix-cc,        status: branch,     alias: [v6.1-no-pep-no-emoji]}
      exact-hybrid-v2.4-lab-split-cc:             {arm: hybrid,         version: "2.4",   harness: cc,     parent: exact-hybrid-v2-testlist-fix-cc,        status: branch,     alias: [v6.1.1-lab-split-cc],
        description: "A variant of exact-hybrid-v2-testlist-fix-cc (arm: hybrid) that moves the lab
          infrastructure (autonomous-execution mandate, done marker, phase-continuation note) into a
          separate lab-only rules file and the refactor-subagent prompt contract into its own rules
          file. The agent-facing method is unchanged."}
      exact-hybrid-v2.5-no-continuation-cc:       {arm: hybrid,         version: "2.5",   harness: cc,     parent: exact-hybrid-v2-testlist-fix-cc,        status: branch,     alias: [v6.1.2-no-continuation-cc]}
      exact-hybrid-v2.6-refactor-gate-cc:         {arm: hybrid,         version: "2.6",   harness: cc,     parent: exact-hybrid-v2-testlist-fix-cc,        status: branch,     alias: [v6.1.3-refactor-gate-cc]}
      exact-hybrid-v2.7-continuation-guard-cc:    {arm: hybrid,         version: "2.7",   harness: cc,     parent: exact-hybrid-v2-testlist-fix-cc,        status: branch,     alias: [v6.1.4-continuation-guard-cc]}
      exact-hybrid-v2.8-pure-split-cc:            {arm: hybrid,         version: "2.8",   harness: cc,     parent: exact-hybrid-v2-testlist-fix-cc,        status: branch,     alias: [v6.1.5-pure-split-cc]}
      exact-hybrid-v2.9-stack-profile-cc:         {arm: hybrid,         version: "2.9",   harness: cc,     parent: exact-hybrid-v2-testlist-fix-cc,        status: branch,     alias: [v6.1.6-stack-profile-cc], note: "Moved all remaining TypeScript/Vitest details from core, phases and refactor agent into the existing stack profile; driver RQ RQ-stack-profile-extraction-opus."}
      exact-hybrid-v3-with-why-cc:                {arm: hybrid,         version: "3",     harness: cc,     parent: exact-hybrid-v2-testlist-fix-cc,        status: trunk,      alias: [v6.1-with-why]}
      exact-hybrid-v4-cleaned-cc:                 {arm: hybrid,         version: "4",     harness: cc,     parent: exact-hybrid-v3-with-why-cc,            status: trunk,      alias: [v6.2-with-why-cleaned],
        description: "An EXACT Coding workflow for Claude Code (arm: hybrid). Derived from the
          hybrid line, it starts with an inactive test list covering every rule, example and
          clarifying question of the specification; the list is not cross-checked. Test list, Red
          (with compile and runtime predictions) and Green run as slash-command skills in one shared
          context. Short \"Why\" blocks explain why Green stays minimal, why the prediction format
          matters and why every phase must be delegated. Refactoring runs in an isolated subagent,
          framed as a standalone refactoring task: naming first, the Four Rules of Simple Design, and
          APP mass before and after."}
      exact-hybrid-v4-cleaned-oc:                 {arm: hybrid,         version: "4",     harness: oc,     parent: exact-hybrid-v4-cleaned-cc,             status: trunk,      alias: [v6.2-with-why-cleaned-oc], port_of: exact-hybrid-v4-cleaned-cc,
        description: "The OpenCode port of exact-hybrid-v4-cleaned-cc (arm: hybrid). Same method and
          content; only the harness packaging differs. Test list, Red and Green are OpenCode skills,
          and Refactor is an OpenCode subagent with restricted permissions that is called through the
          task tool."}
      exact-hybrid-v4-cleaned-pi:                 {arm: hybrid,         version: "4",     harness: pi,     parent: exact-hybrid-v4-cleaned-cc,             status: trunk,      alias: [v6.2-with-why-cleaned-pi], port_of: exact-hybrid-v4-cleaned-cc,
        description: "The pi port of exact-hybrid-v4-cleaned-cc (arm: hybrid). Test list, Red and
          Green are pi skill documents that the agent reads and follows in the main context, and
          Refactor runs in an isolated subagent through a bundled subagent extension. Because pi skill
          phases are not tool calls, the port has the agent mark each phase with fixed headings in its
          output. One rule goes beyond packaging: when a newly activated test already passes, the
          cycle skips Green and Refactor."}
      exact-hybrid-v4.2-phase-continuation-pi:    {arm: hybrid,         version: "4.2",   harness: pi,     parent: exact-hybrid-v4-cleaned-pi,             status: branch,     alias: [v6.2.1-phase-continuation-pi],
        description: "A variant of exact-hybrid-v4-cleaned-pi (arm: hybrid) that changes one thing:
          it tells the agent to treat every phase-completion line as a checkpoint, not as the end of
          its turn. The emphasis is on the step from test list to the first Red, and the run may only
          end once the work is complete. Method and content are otherwise unchanged."}
      exact-hybrid-v4.2-phase-continuation-cursor: {arm: hybrid,        version: "4.2",   harness: cursor, parent: exact-hybrid-v4-cleaned-cc,             status: branch,     alias: [v6.2.1-phase-continuation-cursor],
        description: "The Cursor port of exact-hybrid-v4-cleaned-cc (arm: hybrid). Same method and
          content: test list, Red and Green are Cursor skill documents followed in the main context,
          and Refactor runs as an isolated Cursor subagent. Beyond packaging, it adds visible text
          markers for the skill phases and the same phase-continuation instructions as the pi v4.2
          variant, so that a finished phase or a returning subagent does not end the turn."}
      exact-hybrid-v4.3-audit-bundle-cc:          {arm: hybrid,         version: "4.3",   harness: cc,     parent: exact-hybrid-v4-cleaned-cc,             status: branch,     alias: [v6.3-audit-bundle], note: "Not discarded, but kata-specific: GoL quality champion, breaks on claim-office (RQ-1.9, verification_pct 0.96 -> 0.35)."}
      exact-hybrid-v4.4-metric-refactor-cc:       {arm: hybrid,         version: "4.4",   harness: cc,     parent: exact-hybrid-v4-cleaned-cc,             status: branch,     alias: [v6.4-metric-driven-refactor]}
      exact-hybrid-v5-end-refactor-cc:            {arm: hybrid,         version: "5",     harness: cc,     parent: exact-hybrid-v4-cleaned-cc,             status: trunk,      alias: [v6.5-end-refactor]}
      exact-hybrid-v6-lab-split-cc:               {arm: hybrid,         version: "6",     harness: cc,     parent: exact-hybrid-v5-end-refactor-cc,        status: trunk,      alias: [v6.6-lab-split-cc], note: "The slug means pulling the lab infrastructure out into rules/lab-only.md, not line membership.",
        description: "An EXACT Coding workflow for Claude Code (arm: hybrid). Derived from the
          hybrid line, it has a spec-complete inactive test list that is not cross-checked. Test list,
          Red (with predictions) and Green run as skills in a shared context, and each Refactor runs
          in an isolated subagent (naming first, the Four Rules of Simple Design, APP mass). After the
          last cycle, a second isolated end-refactor subagent makes one pass over the whole production
          code. It works one change at a time, guided by measured smells, cognitive and McCabe
          complexity and APP mass. Lab infrastructure lives in a separate rules file."}
      exact-hybrid-v6-lab-split-pi:               {arm: hybrid,         version: "6",     harness: pi,     parent: exact-hybrid-v6-lab-split-cc,           status: trunk,      alias: [v6.6-lab-split-pi], port_of: exact-hybrid-v6-lab-split-cc}
      exact-hybrid-v6-lab-split-oc:               {arm: hybrid,         version: "6",     harness: oc,     parent: exact-hybrid-v6-lab-split-cc,           status: trunk,      alias: [v6.6-lab-split-oc], port_of: exact-hybrid-v6-lab-split-cc}
      exact-hybrid-v6-lab-split-cursor:           {arm: hybrid,         version: "6",     harness: cursor, parent: exact-hybrid-v6-lab-split-cc,           status: trunk,      alias: [v6.6-lab-split-cursor], port_of: exact-hybrid-v6-lab-split-cc}
      exact-hybrid-v7-app-subordinate-cc:         {arm: hybrid,         version: "7",     harness: cc,     parent: exact-hybrid-v6-lab-split-cc,           status: trunk,      alias: [v6.7-app-subordinate-cc]}
      exact-hybrid-v7-app-subordinate-pi:         {arm: hybrid,         version: "7",     harness: pi,     parent: exact-hybrid-v7-app-subordinate-cc,     status: trunk,      alias: [v6.7-app-subordinate-pi], port_of: exact-hybrid-v7-app-subordinate-cc}
      exact-hybrid-v8-no-end-refactor-cc:         {arm: hybrid,         version: "8",     harness: cc,     parent: exact-hybrid-v7-app-subordinate-cc,     status: trunk,      alias: [v6.8-no-end-refactor-cc]}

      exact-green-refactor-v1-cc:                 {arm: green-refactor, version: "1",     harness: cc,     parent: null,                                   status: superseded, alias: [v7-hybrid-green-refactor]}
      exact-green-refactor-v2-testlist-fix-cc:    {arm: green-refactor, version: "2",     harness: cc,     parent: exact-green-refactor-v1-cc,             status: trunk,      alias: [v7.1-hybrid-green-refactor-testlist-scope-fix],
        description: "An EXACT Coding workflow for Claude Code (arm: green-refactor). Derived from
          the hybrid line, it starts with an inactive test list covering every rule, example and
          clarifying question of the specification; the list is not cross-checked. Test list and Red
          (with compile and runtime predictions) run as skills in the main context. Green and Refactor
          each run in their own isolated subagent: Green writes the minimal passing code, and Refactor
          checks naming first, applies the Four Rules of Simple Design and compares APP mass."}

  exact-coding/sol:
    prefix: exact
    origin: {harness: pi, model: sol}
    workflows:
      exact-sol-v1-pi:                            {arm: sol,            version: "1",     harness: pi,     parent: null,                                   status: trunk,      alias: [basic-sol-tdd-pi], note: "Reference import of the predictive-tdd/test-list skills from the sol_tdd project.",
        description: "An EXACT Coding workflow for the pi harness (arm: sol). It starts with an
          ordered list of inactive tests covering every rule and example in the specification. The
          list is not cross-checked against independent dimensions. The workflow then goes through the
          list one test at a time in predictive Red–Green–Refactor cycles, where a valid Red has to
          fail because the behavior is missing. Refactoring applies only the Four Rules of Simple
          Design: no domain-boundary trial, no APP. Everything runs in one shared context, without
          subagents."}
      exact-sol-v1-cc:                            {arm: sol,            version: "1",     harness: cc,     parent: exact-sol-v1-pi,                        status: trunk,      alias: [basic-sol-tdd-cc], port_of: exact-sol-v1-pi,
        description: "The Claude Code port of exact-sol-v1-pi (arm: sol). It uses the same method
          and content as the pi version; only the packaging differs: slash commands and rules instead
          of pi skills."}
      exact-sol-v1.1-subagent-pi:                 {arm: sol,            version: "1.1",   harness: pi,     parent: exact-sol-v1-pi,                        status: branch,     alias: [basic-sol-tdd-subagent-pi],
        description: "A variant of exact-sol-v1-pi (arm: sol) for pi that changes one thing: the
          Refactor phase runs in an isolated refactoring subagent with a fresh context, while test
          list, Red and Green stay in the main context. The refactoring contract is unchanged: the
          Four Rules of Simple Design, one refactoring at a time."}
      exact-sol-v1.2-app-pi:                      {arm: sol,            version: "1.2",   harness: pi,     parent: exact-sol-v1-pi,                        status: branch,     alias: [basic-sol-tdd-app-pi]}
      exact-sol-v1.2.1-measured-model-pi:         {arm: sol,            version: "1.2.1", harness: pi,     parent: exact-sol-v1.2-app-pi,                  status: branch,     alias: [basic-sol-tdd-app-measured-model-pi]}
      exact-sol-v1.2.2-measured-eslint-pi:        {arm: sol,            version: "1.2.2", harness: pi,     parent: exact-sol-v1.2-app-pi,                  status: branch,     alias: [basic-sol-tdd-app-measured-eslint-pi]}
      exact-sol-v1.2.3-measured-tool-pi:          {arm: sol,            version: "1.2.3", harness: pi,     parent: exact-sol-v1.2-app-pi,                  status: branch,     alias: [basic-sol-tdd-app-measured-tool-pi]}
      exact-sol-v1.3-stack-profile-pi:            {arm: sol,            version: "1.3",   harness: pi,     parent: exact-sol-v1-pi,                        status: branch,     alias: [basic-sol-tdd-stack-profile-pi], note: "Lean/budget variant of the SOL line: remaining TypeScript/Vitest details moved from AGENTS.md and test-list into the existing stack profile; validated by RQ-stack-profile-extraction-sol. Former default, replaced by exact-sol-v1.5-tcr-parity-domain-trial-pi for large, novel specs."}
      exact-sol-v1.3.1-ponytail-pi:                {arm: sol,            version: "1.3.1", harness: pi,     parent: exact-sol-v1.3-stack-profile-pi,        status: branch,     alias: [], note: "Forced Ponytail full augmentation; vendored upstream skill plus lab-authored load overlay. Driver: RQ-ponytail-sol-pi."}
      exact-sol-v1.3.2-local-git-control-pi:        {arm: sol,            version: "1.3.2", harness: pi,     parent: exact-sol-v1.3-stack-profile-pi,        status: branch,     alias: [], note: "Content-identical SOL control minted under the isolated-local-Git harness condition for RQ-tcr-variants-sol; prevents reuse of pre-Git historical runs.",
        description: "A pi workflow (arm: sol) derived from exact-sol-v1.3-stack-profile-pi. It is
          content-identical to that workflow and runs under a different harness condition: the run
          directory is an isolated local Git repository."}
      exact-sol-v1.4-domain-boundary-trial-pi:       {arm: sol,            version: "1.4",   harness: pi,     parent: exact-sol-v1.3.2-local-git-control-pi,  status: branch,     alias: [], note: "Predictive-TDD port of the domain-boundary trial from exact-tcr-v1.3: identical semantic review, change counter-check and before/after evidence; predictive predict/check/undo instead of TCR method commits; stack profiles unchanged. Driver: RQ-srp-effect-exact-tcr-sol."}
