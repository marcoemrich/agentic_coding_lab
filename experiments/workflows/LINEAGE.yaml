      exact-hybrid-v4-cleaned-cc:                 {arm: hybrid,         version: "4",     harness: cc,     parent: exact-hybrid-v3-with-why-cc,            status: trunk,      alias: [v6.2-with-why-cleaned]}
      exact-hybrid-v4-cleaned-oc:                 {arm: hybrid,         version: "4",     harness: oc,     parent: exact-hybrid-v4-cleaned-cc,             status: trunk,      alias: [v6.2-with-why-cleaned-oc], port_of: exact-hybrid-v4-cleaned-cc}
