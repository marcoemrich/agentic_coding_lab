      exact-hybrid-v6-lab-split-pi:               {arm: hybrid,         version: "6",     harness: pi,     parent: exact-hybrid-v6-lab-split-cc,           status: trunk,      alias: [v6.6-lab-split-pi], port_of: exact-hybrid-v6-lab-split-cc}
      exact-hybrid-v6-lab-split-oc:               {arm: hybrid,         version: "6",     harness: oc,     parent: exact-hybrid-v6-lab-split-cc,           status: trunk,      alias: [v6.6-lab-split-oc], port_of: exact-hybrid-v6-lab-split-cc}
      exact-hybrid-v6-lab-split-cursor:           {arm: hybrid,         version: "6",     harness: cursor, parent: exact-hybrid-v6-lab-split-cc,           status: trunk,      alias: [v6.6-lab-split-cursor], port_of: exact-hybrid-v6-lab-split-cc}
