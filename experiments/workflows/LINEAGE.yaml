    origin: {harness: claude-code, model: sonnet/opus}
    workflows:
      exact-subagents-v1-cc:                      {arm: subagents,      version: "1",     harness: cc,     parent: null,                                   status: superseded, alias: [v4-exact-subagents]}
      exact-subagents-v2-testlist-fix-cc:         {arm: subagents,      version: "2",     harness: cc,     parent: exact-subagents-v1-cc,                  status: trunk,      alias: [v4.1-testlist-scope-fix]}
      exact-subagents-v2-testlist-fix-pi:         {arm: subagents,      version: "2",     harness: pi,     parent: exact-subagents-v2-testlist-fix-cc,     status: trunk,      alias: [v4.1-testlist-scope-fix-pi], port_of: exact-subagents-v2-testlist-fix-cc}

      exact-single-context-v1-cc:                 {arm: single-context, version: "1",     harness: cc,     parent: null,                                   status: superseded, alias: [v5-exact-single-context]}
      exact-single-context-v2-testlist-fix-cc:    {arm: single-context, version: "2",     harness: cc,     parent: exact-single-context-v1-cc,             status: trunk,      alias: [v5.1-testlist-scope-fix]}
      exact-single-context-v2-testlist-fix-oc:    {arm: single-context, version: "2",     harness: oc,     parent: exact-single-context-v2-testlist-fix-cc, status: trunk,     alias: [v5.1-testlist-scope-fix-oc], port_of: exact-single-context-v2-testlist-fix-cc}
      exact-single-context-v2-testlist-fix-pi:    {arm: single-context, version: "2",     harness: pi,     parent: exact-single-context-v2-testlist-fix-cc, status: trunk,     alias: [v5.1-testlist-scope-fix-pi], port_of: exact-single-context-v2-testlist-fix-cc}
      exact-single-context-v3-no-subagent-cc:     {arm: single-context, version: "3",     harness: cc,     parent: exact-hybrid-v8-no-end-refactor-cc,     status: branch,     alias: [v5.2-no-subagent-cc], note: "Arm jump: the parent is the hybrid arm. Minimal workflow that is still EXACT Coding — all four building blocks, shared context, no isolated subagent. RQ-1.15 F-1.4 measures it at least as good as exact-hybrid-v8."}

      exact-hybrid-v1-cc:                         {arm: hybrid,         version: "1",     harness: cc,     parent: null,                                   status: superseded, alias: [v6-hybrid]}
      exact-hybrid-v2-testlist-fix-cc:            {arm: hybrid,         version: "2",     harness: cc,     parent: exact-hybrid-v1-cc,                     status: superseded, alias: [v6.1-hybrid-testlist-scope-fix], note: "Former correctness-oriented Opus default; replaced by exact-ptdd-v1-cc as a much cheaper universal default. Remains a reproducible decomposition reference."}
      exact-hybrid-v2-testlist-fix-pi:            {arm: hybrid,         version: "2",     harness: pi,     parent: exact-hybrid-v2-testlist-fix-cc,        status: trunk,      alias: [v6.1-hybrid-testlist-scope-fix-pi], port_of: exact-hybrid-v2-testlist-fix-cc}
      exact-hybrid-v2-testlist-fix-oc:            {arm: hybrid,         version: "2",     harness: oc,     parent: exact-hybrid-v2-testlist-fix-cc,        status: trunk,      alias: [], port_of: exact-hybrid-v2-testlist-fix-cc, note: "Port 2026-09-13 for the exact-coding-baseline export; mechanics from exact-hybrid-v6-lab-split-oc, content from cc/pi. No end-refactor."}
      exact-hybrid-v2-testlist-fix-cursor:        {arm: hybrid,         version: "2",     harness: cursor, parent: exact-hybrid-v2-testlist-fix-cc,        status: trunk,      alias: [], port_of: exact-hybrid-v2-testlist-fix-cc, note: "Port 2026-09-13 for the exact-coding-baseline export; mechanics from exact-hybrid-v6-lab-split-cursor, content from cc/pi. No end-refactor."}
      exact-hybrid-v2.1-no-pep-cc:                {arm: hybrid,         version: "2.1",   harness: cc,     parent: exact-hybrid-v2-testlist-fix-cc,        status: branch,     alias: [v6.1-no-pep]}
      exact-hybrid-v2.2-no-emoji-cc:              {arm: hybrid,         version: "2.2",   harness: cc,     parent: exact-hybrid-v2-testlist-fix-cc,        status: branch,     alias: [v6.1-no-emoji]}
      exact-hybrid-v2.3-no-pep-no-emoji-cc:       {arm: hybrid,         version: "2.3",   harness: cc,     parent: exact-hybrid-v2-testlist-fix-cc,        status: branch,     alias: [v6.1-no-pep-no-emoji]}
      exact-hybrid-v2.4-lab-split-cc:             {arm: hybrid,         version: "2.4",   harness: cc,     parent: exact-hybrid-v2-testlist-fix-cc,        status: branch,     alias: [v6.1.1-lab-split-cc]}
      exact-hybrid-v2.5-no-continuation-cc:       {arm: hybrid,         version: "2.5",   harness: cc,     parent: exact-hybrid-v2-testlist-fix-cc,        status: branch,     alias: [v6.1.2-no-continuation-cc]}
      exact-hybrid-v2.6-refactor-gate-cc:         {arm: hybrid,         version: "2.6",   harness: cc,     parent: exact-hybrid-v2-testlist-fix-cc,        status: branch,     alias: [v6.1.3-refactor-gate-cc]}
      exact-hybrid-v2.7-continuation-guard-cc:    {arm: hybrid,         version: "2.7",   harness: cc,     parent: exact-hybrid-v2-testlist-fix-cc,        status: branch,     alias: [v6.1.4-continuation-guard-cc]}
      exact-hybrid-v2.8-pure-split-cc:            {arm: hybrid,         version: "2.8",   harness: cc,     parent: exact-hybrid-v2-testlist-fix-cc,        status: branch,     alias: [v6.1.5-pure-split-cc]}
      exact-hybrid-v2.9-stack-profile-cc:         {arm: hybrid,         version: "2.9",   harness: cc,     parent: exact-hybrid-v2-testlist-fix-cc,        status: branch,     alias: [v6.1.6-stack-profile-cc], note: "Moved all remaining TypeScript/Vitest details from core, phases and refactor agent into the existing stack profile; driver RQ RQ-stack-profile-extraction-opus."}
