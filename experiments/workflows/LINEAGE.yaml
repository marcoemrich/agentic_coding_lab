# Workflow-Lineage — die Quelle für Abstammung, Status und Alt-Namen.
#
# Diese Datei ist die einzige Wahrheit über Kategorie, Arm, Version, Elternteil
# und Status eines Workflows. ALIASES.json, PATHS.json und die Inventar-Tabelle
# der Snapshot-Reports werden daraus generiert — nie von Hand nachgezogen.
#   Regenerieren + prüfen:  experiments/workflow-lineage.py --check --emit
#
# ---------------------------------------------------------------------------
# Namenskonvention
# ---------------------------------------------------------------------------
#   <präfix>-<arm>-v<MAJOR>[.<N>…][-<slug>]-<harness>
#
# Präfix       exact- | baseline- | external-, muss zur Kategorie passen.
#              Der Ordnerpfad reist nicht: in metrics.json, Run-Ordnernamen,
#              runs.csv und findings-Tabellen steht nur dieser Leaf-Name.
#              Deshalb trägt der Name die Kategorie, nicht nur der Ordner.
#
# Arm          Was der Workflow DAUERHAFT IST (hybrid, single-context, sol …).
# Slug         Was sich IN DIESEM SCHRITT geändert hat (end-refactor, no-pep …).
#              Daher ist "end-refactor-only" ein Arm (Refactor nur am Ende, kein
#              Zyklus), "end-refactor" ein Slug (dieser Schritt fügt ihn hinzu)
#              und "no-end-refactor" ein Slug (dieser Schritt nimmt ihn weg).
#              Entfällt nur bei v1 eines Arms, wo der Arm-Name schon alles sagt.
#
# Version      MAJOR steigt NUR, wenn auf dieser Variante weitergebaut wurde.
#              Ein Arm, der nie Basis eines nächsten Schritts war, bleibt ein
#              .N-Zweig — auch wenn er gut gemessen hat. Die Nummer ist damit
#              Entwicklungstiefe, nicht Güte und nicht Empfehlung.
#              Welcher Workflow Default ist, steht ausschliesslich in
#              research/workflow-dev/model-recommendation-matrix.md — der Default
#              gabelt pro Modell und läuft auch rückwärts.
#
# Harness      cc | oc | pi | cursor. Immer explizit, nie implizit.
#
# ---------------------------------------------------------------------------
# Ordner
# ---------------------------------------------------------------------------
#   exact-coding/   die vier EXACT-Coding-Bausteine (test-list, red, green,
#                   refactor) existieren als eigene commands/skills/agents.
#                   Genau das prüft --check; es ist kein Geschmacksurteil.
#     opus/         gebaut auf Claude Code mit Sonnet/Opus
#     sol/          gebaut auf pi mit SOL
#
#     ACHTUNG: Der Ordnername sagt, WO DIE LINIE GEBAUT WURDE, nicht wo sie
#     läuft. exact-hybrid-v6-lab-split-pi liegt unter opus/, exact-sol-v1-cc
#     unter sol/. Beides ist richtig. Inhaltliche Achsen (APP vs Four Rules,
#     Prediction-Formular vs Prosa) taugen NICHT als Ordner: jede einzelne ist
#     von einer RQ absichtlich überquert worden — exact-sol-v1.2-app-pi trägt
#     APP in die Sol-Linie. Nur die Herkunft kann nicht mehr falsch werden.
#
#   baselines/      Vergleichs-Workflows OHNE EXACT-Coding-Bausteine.
#   external/       vendorte Fremd-Skills. Versionsstelle = Vendoring-Datum aus
#                   der Git-History, denn LICENSE.upstream nennt keine Upstream-
#                   Version. "v1/v2" würde Autorschaft an Fremdcode behaupten.
#   _archive/       spiegelt den Baum. Ausschliesslich status: discarded.
#
# ---------------------------------------------------------------------------
# status
# ---------------------------------------------------------------------------
#   trunk       Basis, auf der weitergebaut wurde
#   branch      Zweig; beantwortet eine RQ, wurde nicht weitergebaut
#   superseded  von einem Trunk-Nachfolger abgelöst, bleibt reproduzierbar
#   discarded   verworfen — liegt unter _archive/, aggregate-by-query bricht ab
#   vendored    Fremdcode, keine eigene Entwicklungslinie
#
# parent ist Pflicht ausser bei Wurzeln. Weicht der Arm des Elternteils vom
# eigenen Arm ab, ist das ein Arm-Sprung: --check meldet ihn als solchen, statt
# ihn stillschweigend durchzuwinken. Siehe exact-single-context-v3-no-subagent-cc.

