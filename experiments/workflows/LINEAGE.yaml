  baselines:
    prefix: baseline
    workflows:
      baseline-oneshot-v1-cc:                     {arm: oneshot,           version: "1",  harness: cc,     parent: null,                                   status: branch,     alias: [v1-oneshot],
        description: "A one-shot baseline for Claude Code (arm: oneshot). The agent reads the
          exercise, implements the solution in a single autonomous pass and runs whatever verification
          it finds appropriate. Tests are not required. There is no test list, no phase structure, no
          refactoring rules and no subagents."}
      baseline-oneshot-v1-oc:                     {arm: oneshot,           version: "1",  harness: oc,     parent: baseline-oneshot-v1-cc,                 status: branch,     alias: [v1-oneshot-oc], port_of: baseline-oneshot-v1-cc}
      baseline-oneshot-v1-pi:                     {arm: oneshot,           version: "1",  harness: pi,     parent: baseline-oneshot-v1-cc,                 status: branch,     alias: [v1-oneshot-pi], port_of: baseline-oneshot-v1-cc}
      baseline-iterative-v1-cc:                   {arm: iterative,         version: "1",  harness: cc,     parent: null,                                   status: branch,     alias: [v2-iterative],
        description: "A plan-and-checklist baseline for Claude Code (arm: iterative). The agent
          breaks the exercise into a checklist of discrete steps, works through it one item at a time
          and ticks each one off. It runs whatever verification it finds appropriate. Tests are not
          required, and there are no TDD phases, no refactoring rules and no subagents; everything
          runs in one context."}
      baseline-inline-tdd-v1-cc:                  {arm: inline-tdd,        version: "1",  harness: cc,     parent: null,                                   status: branch,     alias: [v3-basic-tdd], note: "TDD floor without any structure — only rules/experiment-mode.md. On Sol it beats every architecture (RQ-1.14 F-1.6).",
        description: "A minimal TDD baseline for Claude Code (arm: inline-tdd). The agent is only
          told to solve the exercise test-driven and autonomously. No test list, no phase structure,
          no refactoring rules, no subagents — how TDD is done is left to the model."}
      baseline-inline-tdd-v1-pi:                  {arm: inline-tdd,        version: "1",  harness: pi,     parent: baseline-inline-tdd-v1-cc,              status: branch,     alias: [v3-basic-tdd-pi], port_of: baseline-inline-tdd-v1-cc,
        description: "The pi port of baseline-inline-tdd-v1 (arm: inline-tdd). It gives the same
          minimal instruction to solve the exercise test-driven and autonomously. Only the packaging
          differs: a pi AGENTS.md replaces the Claude Code rules file, and it adds a line to work test
          by test plus a note on the CLI entry-point contract."}
      baseline-inline-tdd-v1.1-local-git-cc:       {arm: inline-tdd,        version: "1.1", harness: cc,    parent: baseline-inline-tdd-v1-cc,              status: branch,     alias: [], note: "Content-identical TDD control minted under the isolated-local-Git harness condition for RQ-tcr-variants-opus5; prevents reuse of pre-Git historical runs.",
        description: "The same minimal TDD instruction as baseline-inline-tdd-v1-cc (arm:
          inline-tdd, Claude Code), run under a different harness condition: the run directory is an
          isolated local Git repository with an initial commit."}
      baseline-inline-tdd-v1.1-local-git-pi:       {arm: inline-tdd,        version: "1.1", harness: pi,    parent: baseline-inline-tdd-v1.1-local-git-cc,   status: branch,     alias: [], port_of: baseline-inline-tdd-v1.1-local-git-cc, note: "Content-identical basic-TDD control minted under the isolated-local-Git harness condition for RQ-tcr-variants-sol; prevents reuse of pre-Git historical runs.",
        description: "The same minimal TDD instruction as baseline-inline-tdd-v1-pi (arm:
          inline-tdd, pi), run under a different harness condition: the run directory is an isolated
          local Git repository with an initial commit."}
      baseline-end-refactor-only-v1-agent-cc:     {arm: end-refactor-only, version: "1",  harness: cc,     parent: baseline-oneshot-v1-cc,                 status: branch,     alias: [v8a-delayed-refactor-agent], note: "No cycle: three sequential phases, refactor only at the end. Isolates refactor timing, not refactor mechanics.",
        description: "A test-after baseline for Claude Code (arm: end-refactor-only). It has three
          sequential phases and no cycle. First the agent implements the solution without tests. Then
          it writes a test suite from the specification, with a test for every spec example and every
          clarifying question, and gets it green. Last comes a single refactoring pass. That pass runs
          in an isolated refactoring subagent with a fresh context and applies the Four Rules of
          Simple Design, the Absolute Priority Premise, a naming evaluation and a mandatory
          refactoring attempt."}
      baseline-end-refactor-only-v1-native-cc:    {arm: end-refactor-only, version: "1",  harness: cc,     parent: baseline-oneshot-v1-cc,                 status: branch,     alias: [v8b-delayed-refactor-native],
        description: "A variant of baseline-end-refactor-only-v1-agent (arm: end-refactor-only) that
          changes one thing: the final refactoring pass runs as a slash command inside the main
          session instead of in a subagent. The refactoring content, the phase order and the timing
          are unchanged."}

  external:
    prefix: external
    workflows:
      external-pocock-2026-09-04-cc:              {arm: pocock,        vendored: "2026-09-04", harness: cc, parent: null,                                  status: vendored,   alias: [v10-pocock-tdd],
        description: "An external workflow for Claude Code (arm: pocock): the tdd, code-review and
          codebase-design skills from Matt Pocock's mattpocock/skills, commit 6654f6b6 (MIT), vendored
          unchanged. Red–Green works in vertical slices, one test at a time, at seams agreed in
          advance. There is no up-front test list, and refactoring is explicitly not part of the loop.
          Once the suite is green, a code review runs in two parallel subagents, one for coding
          standards and one for the spec, and reports its findings without acting on them. The lab
          adds autonomous execution, takes the seams from the prompt, points the review at the written
          files and the prompt instead of a Git diff and an issue tracker, and supplies the test
          command."}
      external-superpowers-2026-09-04-cc:         {arm: superpowers,   vendored: "2026-09-04", harness: cc, parent: null,                                  status: vendored,   alias: [v11-superpowers-tdd],
        description: "An external workflow for Claude Code (arm: superpowers): the
          test-driven-development skill from Jesse Vincent's Superpowers collection, release v6.3.0
          (MIT), vendored unchanged. Red–Green–Refactor under a strict test-first rule — code written
          before its test is deleted. No up-front test list; the next test is chosen as work proceeds,
          all inline in one context. The lab only replaces the human-in-the-loop checkpoints with
          autonomous execution."}
      external-tcr-kentbeck-2026-09-14-cc:        {arm: tcr-kentbeck,  vendored: "2026-09-14", harness: cc, parent: null,                                  status: vendored,   alias: [], note: "Classic TCR from xpepper/tcr-skill commit 48c16c0; test-first is not required.",
        description: "An external workflow for Claude Code (arm: tcr-kentbeck): the tcr-kentbeck
          skill from Pietro Di Bello's xpepper/tcr-skill, commit 48c16c0 (MIT), vendored unchanged. It
          is classic TCR: tiny steps, each run against the full suite, and every reverted step is
          appended to a failure log. Test-first is not required. There is no test list, no phase
          structure and no refactoring rules, and everything runs in one context. The lab adds only
          autonomous execution, the test command and an isolated local Git repository to commit
          into."}
      external-tcrdd-git-gamble-2026-09-14-cc:    {arm: tcrdd-gamble,  vendored: "2026-09-14", harness: cc, parent: null,                                  status: vendored,   alias: [], note: "TCRDD via git-gamble 2.14.6; skill from xpepper/tcr-skill commit 48c16c0.",
        description: "An external workflow for Claude Code (arm: tcrdd-gamble): the tcr skill from
          Pietro Di Bello's xpepper/tcr-skill, commit 48c16c0 (MIT), vendored unchanged. It is TCRDD
          driven by the git-gamble tool. Every Red, Green and Refactor step bets on its expected test
          outcome, then commits if the bet holds and reverts if it does not; a new test that passes
          straight away is reverted too. There is no up-front test list and no refactoring rules
          beyond keeping behaviour unchanged, and everything runs in one context. The lab adds
          autonomous execution, the test command, an installed git-gamble and an isolated local Git
          repository."}
      external-tcrdd-bsene-2026-09-14-cc:         {arm: tcrdd-bsene,   vendored: "2026-09-14", harness: cc, parent: null,                                  status: vendored,   alias: [], note: "Native-Git TCRDD from bsene/skills commit 81a792d; upstream snapshot has no declared license.",
        description: "An external workflow for Claude Code (arm: tcrdd-bsene): the tcrdd skill from
          the bsene/skills repository, commit 81a792d, vendored unchanged; that upstream snapshot
          declares no license. It is TCRDD on plain Git with no external tool. Each Red, Green and
          Refactor phase stages all changes and runs the suite. It commits when the result is what the
          phase expects; otherwise it hard-resets and logs the failure. Green follows a
          transformation-priority ladder. There is no up-front test list, and everything runs in one
          context. The lab runs the skill in its own autonomous mode with the approval gates skipped
          and supplies the test command."}
      external-kesseler-2026-09-30-cc:            {arm: kesseler,      vendored: "2026-09-30", harness: cc, parent: null,                                  status: vendored,   alias: [], note: "TDD skill from lexler/skill-factory commit 474433af2e (output_skills/testing/tdd); Apache-2.0. evals/ deliberately not vendored.",
        description: "An external workflow for Claude Code (arm: kesseler): Lada Kesseler's TDD
          skill from lexler/skill-factory, commit 474433af2e (Apache-2.0), vendored unchanged together
          with its ZOMBIES reference; the upstream eval files are not included. Tests are planned up
          front as one-line test comments and checked for completeness against ZOMBIES. They are then
          worked through one at a time, with predicted failures, a two-step Red (first a compile
          failure, then an assertion failure), a simplify step and a refactor at every green. A final
          evaluation looks for missed tests and hardcoded values. Everything runs inline in one
          context. The lab runs the skill in its auto mode, treats the prompt as the approved plan and
          supplies the test command."}
      external-tcr-kentbeck-2026-09-14-pi:        {arm: tcr-kentbeck,  vendored: "2026-09-14", harness: pi, parent: external-tcr-kentbeck-2026-09-14-cc,     status: vendored,   alias: [], port_of: external-tcr-kentbeck-2026-09-14-cc,
        description: "The pi port of external-tcr-kentbeck-2026-09-14 (arm: tcr-kentbeck). It uses
          the same vendored skill and the same method. Only the packaging differs: the skill sits
          under pi skills, and the lab adaptation lives in AGENTS.md, which adds a reminder that a
          checkpoint does not end the run."}
      external-tcrdd-git-gamble-2026-09-14-pi:    {arm: tcrdd-gamble,  vendored: "2026-09-14", harness: pi, parent: external-tcrdd-git-gamble-2026-09-14-cc, status: vendored,   alias: [], port_of: external-tcrdd-git-gamble-2026-09-14-cc,
        description: "The pi port of external-tcrdd-git-gamble-2026-09-14 (arm: tcrdd-gamble). It
          uses the same vendored skill and the same method. Only the packaging differs: the skill sits
          under pi skills, and the lab adaptation lives in AGENTS.md, which adds a reminder that a
          phase checkpoint does not end the turn."}
      external-tcrdd-bsene-2026-09-14-pi:         {arm: tcrdd-bsene,   vendored: "2026-09-14", harness: pi, parent: external-tcrdd-bsene-2026-09-14-cc,      status: vendored,   alias: [], port_of: external-tcrdd-bsene-2026-09-14-cc, note: "Upstream snapshot has no declared license.",
        description: "The pi port of external-tcrdd-bsene-2026-09-14 (arm: tcrdd-bsene). It uses the
          same vendored skill and the same method. Only the packaging differs: the skill sits under pi
          skills, and the lab adaptation lives in AGENTS.md, which adds a reminder that a phase
          checkpoint does not end the turn."}

