# One entry per metric: the properties the results site and the lab's reports
# need to present it. Read directly by site/ (Vite YAML import) and by the
# site export. A metric missing here is unknown to the site.
#
# group:      result-table column group
# direction:  higher | lower | informative (informative: no winner, no trophy)
# scale:      fraction — a 0–1 share, shown as percent
# not_comparable_across: test-list-boundary — Skip-sensitive, see README
#             "Comparability: the test-list boundary"

verification_pct:
  group: Correctness
  direction: higher
  scale: fraction
tests_passing:
  group: Correctness
  direction: higher
tdd_discipline:
  group: TDD discipline
  direction: higher
  scale: fraction
  not_comparable_across: [test-list-boundary]
