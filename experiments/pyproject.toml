# Host environment for the analysis scripts in this directory and their tests.
#
# Only aggregate-by-query.py needs anything beyond the stdlib: pandas, PyYAML
# and tabulate. tabulate is the trap — it is NEVER imported by our code. pandas
# needs it internally for DataFrame.to_markdown(), which writes summary.md.
# Without it the aggregation dies late, after runs.csv is already written, so a
# grep over imports will not find the requirement.
#
# Set up and run (uv creates experiments/.venv, gitignored):
#   cd experiments && uv sync && uv run pytest
#   uv run --project experiments python experiments/aggregate-by-query.py <rq-dir>
#
# The versions track the host's system interpreter, so the plain
# `python3 experiments/aggregate-by-query.py` calls in skills and docs compute
# the same numbers as `uv run`. That is the only reason these are pinned at all,
# and it makes them a maintenance obligation: when the host's Python moves, the
# pins move with it, or the two paths silently disagree in the last digits of
# every mean and sd in summary.json. Checked against Python 3.14.4 / pandas
# 2.3.3 / numpy 2.3.5 on 2026-10-24; the previous pins claimed to match a system
# Python 3.10 that no longer existed, and pandas 2.1.1 has no wheel for 3.14 at
# all, so `uv sync` tried to compile it and failed.
[project]
name = "agentic-coding-lab-experiments"
version = "0.0.0"
# numpy 2.3.5 needs >=3.11, and the floor exists to keep the uv environment on
# the same interpreter family as the host rather than to support old ones.
requires-python = ">=3.11"
dependencies = [
    "pandas==2.3.3",
    "numpy==2.3.5",
    "PyYAML==6.0.3",
    "tabulate==0.10.0",
]

[dependency-groups]
dev = [
    "pytest==8.0.0",
    "ruff==0.6.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# The lab's Python stack rules (experiments/stacks/python-pytest/pyproject.toml).
# Applied only to files a story touches: `uv run ruff check <files>`. The rest
# of this directory predates the gate and is not cleaned up wholesale.
select = ["C901", "PLR", "PLW", "SIM", "ARG", "F", "B", "RET", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests state specification inputs and outputs as literals, and fixture
# builders take the handful of fields an example needs.
"tests/*" = ["PLR2004", "PLR0913"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 4
max-branches = 12
max-statements = 30
max-nested-blocks = 3
