nd": "num", "value": 604.8, "sd": 58.831964101158476}, "total_tokens": {"n_used": 5, "n": 5, "state": "ok", "kind": "num", "value": 15515624.8, "sd": 2009895.423552728}, "cost_usd": {"n_used": 5, "n": 5, "state": "ok", "kind": "num", "value": 6.85346, "sd": 0.8436419548599988}}}]}], "workflows": {"exact-hybrid-v2-testlist-fix-cc": {"description": "A variant of exact-hybrid-v1-cc (arm: hybrid) whose main change is the test list: it is derived from the whole specification instead of base functionality only. Every rule, every example and every clarifying question gets at least one inactive test, with the expected value in its description. It is ordered from single rules to combinations and multi-step scenarios, and it is not cross-checked. In addition, the refactoring subagent loses its generic project-standards section (TypeScript conventions, hexagonal architecture, build commands).", "arm": "hybrid", "status": "superseded", "test_list": true}, "exact-hybrid-v2.4-lab-split-cc": {"description": "A variant of exact-hybrid-v2-testlist-fix-cc (arm: hybrid) that moves the lab infrastructure (autonomous-execution mandate, done marker, phase-continuation note) into a separate lab-only rules file and the refactor-subagent prompt contract into its own rules file. The agent-facing method is unchanged.", "arm": "hybrid", "status": "branch", "test_list": true}, "exact-ptdd-v1-cc": {"description": "The Claude Code port of exact-ptdd-v1 (arm: ptdd). Same method and content as the pi version; only the harness packaging differs \u2014 slash commands and rules instead of pi skills.", "arm": "ptdd", "status": "trunk", "test_list": true}, "exact-ptdd-v1.1-refactor-subagent-cc": {"description": "The Claude Code port of exact-ptdd-v1.1-refactor-subagent-pi (arm: ptdd). Same method and content; only the packaging differs \u2014 the isolated refactoring runs as a Claude Code Task subagent instead of through the pi subagent extension.", "arm": "ptdd", "status": "branch", "test_list": true}, "external-kesseler-2026-09-30-cc": {"description": "An external workflow for Claude Code (arm: kesseler): Lada Kesseler's TDD skill from lexler/skill-factory, commit 474433af2e (Apache-2.0), vendored unchanged together with its ZOMBIES reference; the upstream eval files are not included. Tests are planned up front as one-line test comments and checked for completeness against ZOMBIES. They are then worked through one at a time, with predicted failures, a two-step Red (first a compile failure, then an assertion failure), a simplify step and a refactor at every green. A final evaluation looks for missed tests and hardcoded values. Everything runs inline in one context. The lab runs the skill in its auto mode, treats the prompt as the approved plan and supplies the test command.", "arm": "kesseler", "status": "vendored", "test_list": false}, "external-pocock-2026-09-04-cc": {"description": "An external workflow for Claude Code (arm: pocock): the tdd, code-review and codebase-design skills from Matt Pocock's mattpocock/skills, commit 6654f6b6 (MIT), vendored unchanged. Red\u2013Green works in vertical slices, one test at a time, at seams agreed in advance. There is no up-front test list, and refactoring is explicitly not part of the loop. Once the suite is green, a code review runs in two parallel subagents, one for coding standards and one for the spec, and reports its findings without acting on them. The lab adds autonomous execution, takes the seams from the prompt, points the review at the written files and the prompt instead of a Git diff and an issue tracker, and supplies the test command.", "arm": "pocock", "status": "vendored", "test_list": false}, "external-superpowers-2026-09-04-cc": {"description": "An external workflow for Claude Code (arm: superpowers): the test-driven-development skill from Jesse Vincent's Superpowers collection, release v6.3.0 (MIT), vendored unchanged. Red\u2013Green\u2013Refactor under a strict test-first rule \u2014 code written before its test is deleted. No up-front test list; the next test is chosen as work proceeds, all inline in one context. The lab only replaces the human-in-the-loop checkpoints with autonomous execution.", "arm": "superpowers", "status": "vendored", "test_list": false}}}, "findings_md": "# Findings \u2014 RQ-4.13: Seven TDD Workflows Compared (opus-5.5)\n\nAll figures: `claim-office-example-mapping` \u00d7 `opus-5-5-no-thinking` (native\nsubscription route) \u00d7 Claude Code 2.1.280, n=5 per cell. The three vendor\nworkflows are snapshots at the commits named in [README.md](README.md); every\nstatement describes those snapshots, not the tools in general.\n\n## Overview\n\nPrimary outcome is Correctness (external). The decomposition metrics follow the\nbinding quality metric from RQ-architecture-axis-opus5 F-1.6. Cells are grouped\nby line: maintained lab, retired lab, vendor.\n\n| Metric | `exact-ptdd-v1-cc` | `exact-ptdd-v1.1-subagent` | `exact-hybrid-v2-testlist-fix` | `exact-hybrid-v2.4-lab-split` | `external-kesseler` | `external-superpowers` | `external-pocock` |\n|---|---:|---:|---:|---:|---:|---:|---:|\n| **Correctness (external)** \u2014 higher = better | **1.00 \u00b1 0.00** \ud83c\udfc6 | 0.96 \u00b1 0.09 | 0.96 \u00b1 0.09 | 0.96 \u00b1 0.09 | **1.00 \u00b1 0.00** \ud83c\udfc6 | **1.00 \u00b1 0.00** \ud83c\udfc6 | **1.00 \u00b1 0.00** \ud83c\udfc6 |\n| perfect runs | **5/5** \ud83c\udfc6 | 4/5 | 4/5 | 4/5 | **5/5** \ud83c\udfc6 | **5/5** \ud83c\udfc6 | **5/5** \ud83c\udfc6 |\n| Correctness (internal) | 100 % | 100 % | 100 % | 100 % | 100 % | 100 % | 100 % |\n| `avg_loc_per_function` \u2014 lower = better | 4.81 \u00b1 0.62 | 4.46 \u00b1 0.40 | **2.92 \u00b1 0.46** \ud83c\udfc6 | **3.32 \u00b1 0.27** \ud83c\udfc6 | 6.23 \u00b1 1.51 | 6.48 \u00b1 0.82 | 9.46 \u00b1 1.11 |\n| `longest_function` \u2014 lower = better, no winner | 13.00 \u00b1 1.58 | 14.20 \u00b1 2.17 | 11.00 \u00b1 4.36 | 14.20 \u00b1 6.38 | 14.80 \u00b1 1.64 | 15.80 \u00b1 1.30 | 19.20 \u00b1 1.92 |\n| `cognitive_max` \u2014 lower = better | **2.40 \u00b1 0.55** \ud83c\udfc6 | **2.00 \u00b1 0.00** \ud83c\udfc6 | **2.40 \u00b1 0.89** \ud83c\udfc6 | **2.40 \u00b1 1.14** \ud83c\udfc6 | 3.60 \u00b1 1.34 | 4.00 \u00b1 1.41 | 7.20 \u00b1 3.42 |\n| `mccabe_max` \u2014 lower = better | **3.40 \u00b1 0.55** \ud83c\udfc6 | **3.00 \u00b1 0.00** \ud83c\udfc6 | **3.20 \u00b1 0.45** \ud83c\udfc6 | **3.20 \u00b1 0.45** \ud83c\udfc6 | 4.40 \u00b1 0.89 | 4.40 \u00b1 0.55 | 6.40 \u00b1 2.30 |\n| **Smell Total** \u2014 lower = better | **0.00 \u00b1 0.00** \ud83c\udfc6 | **0.00 \u00b1 0.00** \ud83c\udfc6 | 0.80 \u00b1 0.45 | 0.80 \u00b1 0.45 | **0.00 \u00b1 0.00** \ud83c\udfc6 | **0.00 \u00b1 0.00** \ud83c\udfc6 | 2.20 \u00b1 3.35 |\n| **Code Mass (APP)** \u2014 lower = better | 632 \u00b1 36 | 655 \u00b1 57 | 742 \u00b1 62 | 733 \u00b1 105 | **560 \u00b1 13** \ud83c\udfc6 | 634 \u00b1 30 | **585 \u00b1 15** \ud83c\udfc6 |\n| `duration_seconds` \u2014 lower = better | 922 \u00b1 80 | 2664 \u00b1 433 | 1117 \u00b1 138 | 1217 \u00b1 165 | 605 \u00b1 59 | **372 \u00b1 45** \ud83c\udfc6 | **310 \u00b1 44** \ud83c\udfc6 |\n| `total_tokens` \u2014 lower = better | 24.4 M \u00b1 1.8 M | 55.3 M \u00b1 7.6 M | 51.0 M \u00b1 5.2 M | 54.0 M \u00b1 12.5 M | 15.5 M \u00b1 2.0 M | 7.3 M \u00b1 0.8 M | **5.3 M \u00b1 0.7 M** \ud83c\udfc6 |\n| `cost_usd` \u2014 lower = better | 9.79 \u00b1 0.49 | 28.34 \u00b1 3.30 | 18.35 \u00b1 2.18 | 20.16 \u00b1 4.20 | 6.85 \u00b1 0.84 | **3.45 \u00b1 0.25** \ud83c\udfc6 | **2.97 \u00b1 0.33** \ud83c\udfc6 |\n| `refactor_events` \u2014 design characteristic | 16.6 \u00b1 2.4 | 30.6 \u00b1 9.7 | 24.8 \u00b1 5.2 | 29.6 \u00b1 6.5 | 7.2 \u00b1 2.4 | 5.0 \u00b1 2.6 | 0.6 \u00b1 0.9 |\n\n> **Correctness (internal) carries no trophy** \u2014 all seven cells are at 100 %, so\n> the row has no contest.\n>\n> **Correctness-gating does not bind here.** Every cell is at\n> `verification_pct` \u2265 0.96, so all seven are eligible for the quality and cost\n> trophies. Multiple trophies in a row mark values that are indistinguishable at\n> 1 \u03c3, not a fabricated tie.\n>\n> **`longest_function` carries no trophy at all.** Six of the seven cells lie\n> between 11.00 and 15.80 with overlapping \u03c3 bands \u2014 `hybrid-v2`'s band alone\n> spans 6.64 to 15.36 and covers both `kesseler` and `superpowers`. The only\n> separation in that row is `pocock` at the top end. Awarding a winner inside\n> that band would be rounding noise.\n>\n> **Read Code Mass (APP) with the decomposition rows, never alone.** The two\n> trophy cells sit at opposite ends of `avg_loc_per_function`: `kesseler` at\n> 6.23 and `pocock` at 9.46, the worst in the field. Both solved the full\n> specification (5/5 perfect), so neither is disqualified \u2014 but the low value\n> means compacted, not parsimonious. F-4.13.6.\n>\n> `refactor_events` carries no trophy: 0.6 against 30.6 is the field's design\n> axis, not a result.\n\n### TDD discipline \u2014 within architecture group only\n\n`tdd_discipline` is **not comparable across the test-list boundary** (F-4.13.4).\nFour workflows derive the next test from a test list written up front, three\nderive it ad hoc, and `skip_events` counts a test that passes on activation as a\ndeviation \u2014 which the test-list contract explicitly permits. The two groups are\ntherefore tabled apart and no trophy crosses between them.\n\n**Group A \u2014 test-list workflows** (`test-list.md` command, inactive tests)\n\n| Metric | `exact-ptdd-v1-cc` | `exact-ptdd-v1.1-subagent` | `exact-hybrid-v2-testlist-fix` | `exact-hybrid-v2.4-lab-split` |\n|---|---:|---:|---:|---:|\n| `tdd_discipline` \u2014 higher = better | 0.63 \u00b1 0.01 | 0.62 \u00b1 0.03 | **0.71 \u00b1 0.02** \ud83c\udfc6 | 0.70 \u00b1 0.01 |\n| `tdd_discipline_test_first` | 0.51 \u00b1 0.02 | 0.50 \u00b1 0.03 | **0.61 \u00b1 0.02** \ud83c\udfc6 | 0.59 \u00b1 0.02 |\n| `tdd_discipline_step` | **1.00 \u00b1 0.00** \ud83c\udfc6 | **1.00 \u00b1 0.00** \ud83c\udfc6 | **1.00 \u00b1 0.00** \ud83c\udfc6 | **1.00 \u00b1 0.00** \ud83c\udfc6 |\n| `tdd_discipline_closure` | 0.49 \u00b1 0.02 | 0.48 \u00b1 0.04 | **0.59 \u00b1 0.02** \ud83c\udfc6 | 0.58 \u00b1 0.01 |\n| `skip_events` \u2014 lower = better | 23.8 \u00b1 1.3 | 25.8 \u00b1 2.9 | **16.6 \u00b1 1.1** \ud83c\udfc6 | **16.6 \u00b1 1.3** \ud83c\udfc6 |\n| `red_batch_max` \u2014 lower = better | **1.00 \u00b1 0.00** \ud83c\udfc6 | **1.00 \u00b1 0.00** \ud83c\udfc6 | **1.00 \u00b1 0.00** \ud83c\udfc6 | **1.00 \u00b1 0.00** \ud83c\udfc6 |\n| `cycles_total` / `cycles_closed` | 49.6 / 24.2 | 52.0 / 25.0 | 42.4 / 25.2 | 41.8 / 24.2 |\n| `chain_suite_runs` | 95.4 | 161.8 | 103.6 | 106.2 |\n\n**Group B \u2014 ad-hoc workflows** (next test derived per cycle, no test list)\n\n| Metric | `external-kesseler` | `external-superpowers` | `external-pocock` |\n|---|---:|---:|---:|\n| `tdd_discipline` \u2014 higher = better | **0.85 \u00b1 0.06** \ud83c\udfc6 | **0.84 \u00b1 0.04** \ud83c\udfc6 | **0.82 \u00b1 0.07** \ud83c\udfc6 |\n| `tdd_discipline_test_first` | **0.79 \u00b1 0.09** \ud83c\udfc6 | 0.75 \u00b1 0.04 | **0.80 \u00b1 0.05** \ud83c\udfc6 |\n| `tdd_discipline_step` | **1.00 \u00b1 0.00** \ud83c\udfc6 | **1.00 \u00b1 0.00** \ud83c\udfc6 | 0.90 \u00b1 0.22 |\n| `tdd_discipline_closure` | **0.78 \u00b1 0.09** \ud83c\udfc6 | **0.80 \u00b1 0.09** \ud83c\udfc6 | **0.80 \u00b1 0.07** \ud83c\udfc6 |\n| `skip_events` \u2014 lower = better | 8.2 \u00b1 3.1 | **2.4 \u00b1 1.3** \ud83c\udfc6 | **3.8 \u00b1 1.6** \ud83c\udfc6 |\n| `red_batch_max` \u2014 lower = better | **2.60 \u00b1 0.89** \ud83c\udfc6 | 4.80 \u00b1 0.84 | 4.40 \u00b1 1.67 |\n| `cycles_total` / `cycles_closed` | 39.4 / 30.4 | 23.2 / 18.6 | 18.8 / 15.0 |\n| `chain_suite_runs` | 83.4 | 52.6 | 36.6 |\n\n> The three `tdd_discipline` values in group B lie within 1 \u03c3 of each other \u2014 the\n> reading is \"indistinguishable\", hence three trophies.\n\n---\n\n## F-4.13.1 \u2014 Every workflow solves the kata; the perfect-run split is 4/3\n\nAll seven cells pass their own suite in 5/5 runs and reach `verification_pct`\n\u2265 0.96. Four cells are perfect in every replicate, three miss one acceptance\ncase in one replicate each.\n\n| | perfect runs | Correctness (external) |\n|---|---:|---:|\n| `exact-ptdd-v1-cc` | 5/5 | 1.00 \u00b1 0.00 |\n| `external-kesseler-2026-09-30-cc` | 5/5 | 1.00 \u00b1 0.00 |\n| `external-superpowers-2026-09-04-cc` | 5/5 | 1.00 \u00b1 0.00 |\n| `external-pocock-2026-09-04-cc` | 5/5 | 1.00 \u00b1 0.00 |\n| `exact-ptdd-v1.1-refactor-subagent-cc` | 4/5 | 0.96 \u00b1 0.09 |\n| `exact-hybrid-v2-testlist-fix-cc` | 4/5 | 0.96 \u00b1 0.09 |\n| `exact-hybrid-v2.4-lab-split-cc` | 4/5 | 0.96 \u00b1 0.09 |\n\nH5 confirmed for all seven cells. H6 confirmed as well: the between-cell spread\n(0.96 to 1.00) is smaller than the within-cell spread of the three imperfect\ncells (\u03c3 0.09 each), so correctness does not separate this field. On this kata\nthe metric is close to a bit rather than a degree, and the comparison has to be\ncarried by decomposition, discipline and cost.\n\nThe three imperfect cells share a property worth naming: all three delegate the\nper-cycle Refactor step to an isolated subagent. The three cells that never\ndelegate \u2014 plus `exact-ptdd-v1-cc`, which refactors inline \u2014 are perfect in\n15/15 runs. At n=5 per cell this is an observation, not an effect.\n\n---\n\n## F-4.13.2 \u2014 Decomposition follows refactor frequency, and the lab contract leads\n\n`avg_loc_per_function` orders the field almost exactly inversely to\n`refactor_events`.\n\n| | `refactor_events` | `avg_loc_per_function` | `cognitive_max` | `mccabe_max` |\n|---|---:|---:|---:|---:|\n| `exact-hybrid-v2-testlist-fix-cc` | 24.8 | 2.92 \u00b1 0.46 | 2.40 | 3.20 |\n| `exact-hybrid-v2.4-lab-split-cc` | 29.6 | 3.32 \u00b1 0.27 | 2.40 | 3.20 |\n| `exact-ptdd-v1.1-refactor-subagent-cc` | 30.6 | 4.46 \u00b1 0.40 | 2.00 | 3.00 |\n| `exact-ptdd-v1-cc` | 16.6 | 4.81 \u00b1 0.62 | 2.40 | 3.40 |\n| `external-kesseler-2026-09-30-cc` | 7.2 | 6.23 \u00b1 1.51 | 3.60 | 4.40 |\n| `external-superpowers-2026-09-04-cc` | 5.0 | 6.48 \u00b1 0.82 | 4.00 | 4.40 |\n| `external-pocock-2026-09-04-cc` | 0.6 | 9.46 \u00b1 1.11 | 7.20 | 6.40 |\n\nThe clean test of refactor position is `pocock` against `superpowers` and\n`kesseler` \u2014 same architecture (one inline skill), only the stage varies.\n`avg_loc_per_function` 9.46 against 6.48 and 6.23 is a gap of \u2248 3 \u03c3, and\n`cognitive_max` 7.20 against 4.00 and 3.60 points the same way. H7 confirmed:\na refactor stage has an effect, and the design doctrine in Pocock's prompt\n(\"deep modules\", \"small interfaces\") does not replace it.\n\nAcross the whole field the ordering is not strictly monotone in\n`refactor_events`: `exact-ptdd-v1-cc` refactors least of the four lab cells\n(16.6) and still decomposes better than every vendor cell. What separates the\ngroups is not refactor count but the contract \u2014 all four lab workflows carry an\nexplicit decomposition obligation, the vendor skills carry a refactor stage\nwithout one.\n\n---\n\n## F-4.13.3 \u2014 The isolated refactor subagent buys a deterministic complexity floor at 2.9\u00d7 the price\n\n`exact-ptdd-v1-cc` against `exact-ptdd-v1.1-refactor-subagent-cc` is the only\nsingle-variable contrast in the field: same contract, same prose, same refactor\nposition, and the Refactor step either runs in the main context or in an\nisolated subagent.\n\n| | shared context | isolated subagent | factor |\n|---|---:|---:|---:|\n| `cognitive_max` | 2.40 \u00b1 0.55 | 2.00 \u00b1 0.00 | \u2014 |\n| `mccabe_max` | 3.40 \u00b1 0.55 | 3.00 \u00b1 0.00 | \u2014 |\n| `avg_loc_per_function` | 4.81 \u00b1 0.62 | 4.46 \u00b1 0.40 | 0.93\u00d7 |\n| Correctness (external) | 1.00 \u00b1 0.00 (5/5) | 0.96 \u00b1 0.09 (4/5) | \u2014 |\n| `tdd_discipline` | 0.63 \u00b1 0.01 | 0.62 \u00b1 0.03 | 0.98\u00d7 |\n| `refactor_events` | 16.6 \u00b1 2.4 | 30.6 \u00b1 9.7 | 1.8\u00d7 |\n| `chain_suite_runs` | 95.4 \u00b1 5.4 | 161.8 \u00b1 13.2 | 1.7\u00d7 |\n| `duration_seconds` | 922 \u00b1 80 | 2664 \u00b1 433 | **2.9\u00d7** |\n| `total_tokens` | 24.4 M \u00b1 1.8 M | 55.3 M \u00b1 7.6 M | **2.3\u00d7** |\n| `cost_usd` | 9.79 \u00b1 0.49 | 28.34 \u00b1 3.30 | **2.9\u00d7** |\n\nWhat the subagent buys is **determinism, not a lower mean**: `cognitive_max`\ndrops 2.40 \u2192 2.00 and `mccabe_max` 3.40 \u2192 3.00, each at \u03c3 = 0.00 against \u03c3 = 0.55.\nEvery one of the five subagent runs lands on the same value; the shared-context\ncell scatters. The decomposition metric the architecture is usually argued on,\n`avg_loc_per_function`, moves 4.81 \u2192 4.46 \u2014 well inside 1 \u03c3, so no gain is\ndemonstrated there.\n\nH11 confirmed in its discipline half and refuted in its decomposition half:\n`tdd_discipline` is unchanged (0.63 against 0.62, both \u03c3 \u2264 0.03), exactly as\npredicted, because the subagent changes where the Refactor step runs and not\nwhether a failing test preceded the code. But the predicted decomposition gain\ndoes not appear on `avg_loc_per_function`; what appears instead is a\ndeterministic ceiling on the two complexity metrics.\n\nThe price is the finding's other half. 2.9\u00d7 wallclock, 2.3\u00d7 tokens and 2.9\u00d7 list\nprice make this the most expensive cell in the field \u2014 more expensive than either\nretired hybrid variant \u2014 and Correctness (external) drops from 5/5 perfect to\n4/5. On opus-5 the same arm hits the two-hour budget ceiling in 2 of 5 runs\n(RQ-2.4), so the cost is not only high but close to a hard limit.\n\nH12 confirmed: `refactor_events` rises 1.8\u00d7 while decomposition does not follow.\nThe column reads the architecture \u2014 an isolated subagent returns a changed tree\nper invocation where the inline variant may touch the code repeatedly \u2014 not the\neffort spent. `refactor_per_cycle` 0.69 against 1.23 says the same thing and\ntakes no trophy for it.\n\n---\n\n## F-4.13.4 \u2014 `tdd_discipline` is not comparable across the test-list boundary\n\nThe discipline score orders the field exactly inversely to code quality: the\nthree vendor cells lead at 0.82\u20130.85 and hold the worst decomposition, the four\nlab cells trail at 0.62\u20130.71 and hold the best. That ordering is an artefact of\none label.\n\n`skip_events` \u2014 a test that arrived and passed immediately, never red \u2014 splits\nalong the architecture, not along the quality:\n\n| | `skip_events` | thereof activating a test | test list up front |\n|---|---:|---:|:-:|\n| `exact-ptdd-v1.1-refactor-subagent-cc` | 25.8 | 21.6 | yes (46.4 tests at invocation 1) |\n| `exact-ptdd-v1-cc` | 23.8 | 23.0 | yes (47.0) |\n| `exact-hybrid-v2-testlist-fix-cc` | 16.6 | 16.0 | yes |\n| `exact-hybrid-v2.4-lab-split-cc` | 16.6 | 16.0 | yes |\n| `external-kesseler-2026-09-30-cc` | 8.2 | 7.8 | no |\n| `external-pocock-2026-09-04-cc` | 3.8 | 3.2 | no |\n| `external-superpowers-2026-09-04-cc` | 2.4 | 2.0 | no |\n\nA Skip hits the score twice: it sits in the denominator of `test_first_rate`, and\nit is a `CYCLE_OPENERS` member, so it opens a cycle that has no failure to close\nand therefore depresses `tdd_discipline_closure`. Those are precisely the two\ncomponents in which the lab cells trail; the third, `tdd_discipline_step`, is\n1.00 in six of seven cells.\n\nThe two workflow families prescribe opposite handling of the same event.\n`exact-ptdd-v1-cc`'s rules: *\"A test already satisfied by an earlier\ngeneralization is legitimate evidence. Do not manufacture a failure.\"*\nSuperpowers' `SKILL.md`, under \"Red Flags \u2014 STOP and Start Over\": *\"Test passes\nimmediately\"* \u2192 *\"Delete code\"*. Kesseler takes a middle position, obliging the\nmodel to pause and name which earlier step satisfied the test for free. The\nhybrid pair and Pocock state no rule at all \u2014 and that silent group spans both\nfamilies, which is why the doctrine wording does not predict the numbers and the\ntest list does.\n\nThe cause is the test-list contract itself. `test-list.md` Step 5 requires a\ncross-check over independent specification dimensions \u2014 operation, entity,\ninput category, policy attribute, state transition, observable result \u2014 and a\ngeneralisation written for one cell necessarily satisfies cells of other\ndimensions. The more complete the list, the more tests pass on activation. The\nmetric penalises test-list completeness.\n\nThis is not a defect in `tdd-report.py`. The phase chain reads artifact state,\nand a *prediction* leaves none \u2014 the README says so for `predictions_*`. The\nconsequence for this RQ is procedural: `tdd_discipline` is read within group A\nand within group B, never across, and H1 is not answerable on this metric.\nCorrectness, decomposition and cost are unaffected and stay comparable across\nall seven cells.\n\n---\n\n## F-4.13.5 \u2014 One failing test at a time is universal; only the vendor skills ever batch\n\n`tdd_discipline_step` is 1.00 \u00b1 0.00 in six of seven cells and 0.90 \u00b1 0.22 in\n`pocock`. Median `red_batch_size` is 1 everywhere. The step-size hypothesis is\nrefuted \u2014 but the maximum tells the opposite story from the score.\n\n| | `red_batch_size` (median) | `red_batch_max` |\n|---|---:|---:|\n| all four lab cells | 1.00 \u00b1 0.00 | **1.00 \u00b1 0.00** |\n| `external-kesseler-2026-09-30-cc` | 1.00 \u00b1 0.00 | 2.60 \u00b1 0.89 |\n| `external-pocock-2026-09-04-cc` | 1.20 \u00b1 0.45 | 4.40 \u00b1 1.67 |\n| `external-superpowers-2026-09-04-cc` | 1.00 \u00b1 0.00 | 4.80 \u00b1 0.84 |\n\nThe four lab workflows never once let more than a single test fail at a time\nacross 20 runs. The vendor skills do: up to 4.8 tests newly failing in one\ninvocation for `superpowers`, which its own skill text forbids (\"Write **one\nminimal test**\", \"One behavior\"). H2 is therefore refuted as stated \u2014 the\nseparation is not in the median step size \u2014 and the direction reverses on the\nmaximum, where the cells with the *higher* discipline score are the ones that\nbatch.\n\nH6, the manual n=1 observation that Superpowers writes all tests at once, does\nnot reproduce either: at `red_batch_size` median 1.00 and 23.2 cycles, the tests\narrive incrementally.\n\n---\n\n## F-4.13.6 \u2014 Cost spans a factor of ten, and Code Mass (APP) runs opposite to decomposition\n\n| | `cost_usd` | `duration_seconds` | `total_tokens` | Code Mass (APP) | `avg_loc_per_function` |\n|---|---:|---:|---:|---:|---:|\n| `external-pocock-2026-09-04-cc` | 2.97 \u00b1 0.33 | 310 \u00b1 44 | 5.3 M | 585 \u00b1 15 | 9.46 |\n| `external-superpowers-2026-09-04-cc` | 3.45 \u00b1 0.25 | 372 \u00b1 45 | 7.3 M | 634 \u00b1 30 | 6.48 |\n| `external-kesseler-2026-09-30-cc` | 6.85 \u00b1 0.84 | 605 \u00b1 59 | 15.5 M | 560 \u00b1 13 | 6.23 |\n| `exact-ptdd-v1-cc` | 9.79 \u00b1 0.49 | 922 \u00b1 80 | 24.4 M | 632 \u00b1 36 | 4.81 |\n| `exact-hybrid-v2-testlist-fix-cc` | 18.35 \u00b1 2.18 | 1117 \u00b1 138 | 51.0 M | 742 \u00b1 62 | 2.92 |\n| `exact-hybrid-v2.4-lab-split-cc` | 20.16 \u00b1 4.20 | 1217 \u00b1 165 | 54.0 M | 733 \u00b1 105 | 3.32 |\n| `exact-ptdd-v1.1-refactor-subagent-cc` | 28.34 \u00b1 3.30 | 2664 \u00b1 433 | 55.3 M | 655 \u00b1 57 | 4.46 |\n\nH9 confirmed: the vendor skills are an order of magnitude cheaper than the\nexpensive end of the lab field \u2014 $2.97 against $28.34 is 9.5\u00d7, and the token\nratio (5.3 M against 55.3 M, 10.4\u00d7) exceeds the wallclock ratio (8.6\u00d7) as\npredicted. H10 is **refuted**: `pocock` *is* the cheapest cell on all three cost\nmetrics despite its two review sub-agents. The review stage costs less than the\nper-cycle refactor stage it replaces.\n\nCode Mass (APP) does not follow quality. `pocock` writes 585 lines into the\nlongest and most complex functions in the field (`avg_loc_per_function` 9.46,\n`cognitive_max` 7.20); `hybrid-v2` writes 742 and distributes them most finely\n(2.92, 2.40). Read alone, the column would present `pocock` as the leaner result;\nit is the compacted one. `kesseler` holds the lowest value at 560 and sits\nmid-field on decomposition, which is why the row carries two trophies and a\ncaveat rather than a verdict.\n\n`cost_usd` is a list-price comparison value, not an invoice \u2014 these runs went\nover the native subscription route. Sources: `research/model-pricing.md`.\n\n---\n\n## F-4.13.7 \u2014 The maintained line trades decomposition for correctness, smells and half the cost\n\n`exact-ptdd-v1-cc` against the retired hybrid pair, all three group A.\n\n| | `exact-ptdd-v1-cc` | `exact-hybrid-v2-testlist-fix-cc` | `exact-hybrid-v2.4-lab-split-cc` |\n|---|---:|---:|---:|\n| Correctness (external) | 1.00 \u00b1 0.00 (5/5) | 0.96 \u00b1 0.09 (4/5) | 0.96 \u00b1 0.09 (4/5) |\n| `avg_loc_per_function` | 4.81 \u00b1 0.62 | 2.92 \u00b1 0.46 | 3.32 \u00b1 0.27 |\n| `cognitive_max` | 2.40 \u00b1 0.55 | 2.40 \u00b1 0.89 | 2.40 \u00b1 1.14 |\n| Smell Total | 0.00 \u00b1 0.00 | 0.80 \u00b1 0.45 | 0.80 \u00b1 0.45 |\n| Code Mass (APP) | 632 \u00b1 36 | 742 \u00b1 62 | 733 \u00b1 105 |\n| `cost_usd` | 9.79 \u00b1 0.49 | 18.35 \u00b1 2.18 | 20.16 \u00b1 4.20 |\n| `tdd_discipline` | 0.63 \u00b1 0.01 | 0.71 \u00b1 0.02 | 0.70 \u00b1 0.01 |\n\nH13 is **not confirmed as stated**. The retired line decomposes measurably\nbetter \u2014 2.92 against 4.81 on `avg_loc_per_function` is \u2248 3 \u03c3 \u2014 so the\nmaintained line does not match it on the axis the promotion is usually argued on.\nWhat the maintained line holds instead: perfect Correctness (external) in 5/5\nruns where hybrid manages 4/5, `Smell Total` deterministically 0.00 against 0.80,\n110 fewer lines of Code Mass (APP), and **half the list price**. The two lines\nare also level on `cognitive_max` at 2.40.\n\nThe reading is a trade, not a regression: the promotion of the Predictive-TDD\nline buys correctness, cleanliness and cost at the price of the hybrid line's\nfiner decomposition. Anything beyond that \u2014 portability across harnesses and\nmodels, which is the stated reason for the promotion \u2014 this kata does not\nmeasure.\n\nWithin the retired pair, `hybrid-v2` against `hybrid-v2.4` reproduces RQ-1.19 on\nthis model: the split layout refactors more (29.6 against 24.8 `refactor_events`)\nat +9 % wallclock and +10 % list price, with every quality metric inside 1 \u03c3 of\nthe other. No quality return for the premium.\n"}, {"id": "RQ-tdd-correctness", "question": "Does external correctness (verification_pct) differ between TDD workflow variants on the novel claim-office kata?", "subtree": "questions-claude", "chapter": "4.2", "dir": "research/questions-claude/4.2-tdd-effect-correctness", "closed": null, "cells": 7, "cells_full": 7, "runs": 36, "span": ["2026-05-08", "2026-05-25"], "min_replicates": 3, "katas": ["claim-office-example-mapping"]}, {"id": "RQ-context", "question": "Which form of context structuring \u2014 isolated subagent contexts per TDD phase (subagents-v2), a shared, accumulated single context (single-context-v2), a hybrid with skill-based red/green in the shared context and an isolated refactor subagent (hybrid-v2), or a hybrid with isolated green and refactor subagents alongside a shared-context test list/red (green-refactor-v2) \u2014 leads to better code quality?", "subtree": "questions-claude", "chapter": "4.3", "dir": "research/questions-claude/4.3-tdd-context-engineering", "closed": null, "cells": 4, "cells_full": 4, "runs": 21, "span": ["2026-05-20", "2026-05-24"], "min_replicates": 3, "katas": ["claim-office-example-mapping"]}, {"id": "RQ-architecture-axis-opus5", "question": "Does the TDD architecture axis (inline-tdd-v1 structureless / single-context-v2 single context / hybrid-v2 hybrid / hybrid-v6 current generation) still rank the same way on opus-5 as it does on opus-4-7 \u2014 and does the decomposition metric change the answer?", "subtree": "questions-claude", "chapter": "4.5", "dir": "research/questions-claude/4.5-architecture-axis-opus5", "closed": null, "cells": 16, "cells_full": 16, "runs": 111, "span": ["2026-05-08", "2026-09-10"], "min_replicates": 5, "katas": ["claim-office-example-mapping", "game-of-life-example-mapping"]}, {"id": "RQ-sol-line-on-opus-cc", "question": "Is the native Sol workflow line (basic-sol-tdd, Predictive TDD, Four Rules refactor) better only on Sol/pi, or does it also beat the opus line on Opus with native Claude Code \u2014 and does the APP effect that suppresses decomposition on Sol reproduce there?", "subtree": "questions-claude", "chapter": "4.6", "dir": "research/questions-claude/4.6-sol-line-on-opus-cc", "closed": null, "cells": 6, "cells_full": 6, "runs": 31, "span": ["2026-05-29", "2026-08-17"], "min_replicates": 5, "katas": ["claim-office-example-mapping"]}, {"id": "RQ-external-tdd-workflows-opus5", "question": "Can the inner TDD loop of EXACT Coding be substituted by an externally authored TDD workflow, and what does the substitution cost or buy? Example mapping stays the entry point; only the implement/test/refactor loop is exchanged. Measured on claim-office-example-mapping against the current exact-coding baseline exact-hybrid-v2.4-lab-split-cc \u2014 on correctness, code quality, TDD discipline and cost.", "subtree": "questions-claude", "chapter": "4.7", "dir": "research/questions-claude/4.7-external-tdd-workflows-opus5", "closed": "superseded by RQ-tdd-workflow-comparison-opus55 \u2014 the kesseler cell was never filled, and phase-chain discipline cannot be reconstructed for these runs", "cells": 4, "cells_full": 3, "runs": 15, "span": ["2026-09-03", "2026-09-04"], "min_replicates": 5, "katas": ["claim-office-example-mapping"], "detail": {"outcomes": ["verification_pct", "tests_passing", "completed_within_budget", "refactorings_applied", "tests_passed_immediately", "predictions_correct_rate", "cycle_count", "test_blocks", "test_cases_total", "test_cases_first_block", "red_verified", "red_unverified", "suite_cycles", "suite_new_failures", "suite_opens_red", "suite_unresolved_ m", "value": 0.0, "sd": 0.0}, "tests_passed_immediately": {"n_used": 5, "n": 5, "state": "ok", "kind": "num", "value": 0.0, "sd": 0.0, "trophy": true}, "predictions_correct_rate": {"state": "not_collected", "n": 5}, "cycle_count": {"n_used": 5, "n": 5, "state": "ok", "kind": "num", "value": 35.2, "sd": 2.280350850198276}, "test_blocks": {"n_used": 5, "n": 5, "state": "ok", "kind": "num", "value": 19.0, "sd": 2.7386127875258306}, "test_cases_total": {"n_used": 5, "n": 5, "state": "ok", "kind": "num", "value": 36.8, "sd": 5.263078946776307}, "test_cases_first_block": {"n_used": 5, "n": 5, "state": "ok", "kind": "num", "value": 1.0, "sd": 0.0}, "red_verified": {"n_used": 5, "n": 5, "state": "ok", "kind": "num", "value": 18.8, "sd": 2.3874672772626644}, "red_unverified": {"n_used": 5, "n": 5, "state": "ok", "kind": "num", "value": 0.2, "sd": 0.4472135954999579}, "suite_cycles": {"state": "not_collected", "n": 5}, "suite_new_failures": {"state": "not_collected", "n": 5}, "suite_opens_red": {"state": "not_collected", "n": 5}, "suite_unresolved_red": {"state": "not_collected", "n": 5}, "suite_runs": {"state": "not_collected", "n": 5}, "suite_unknown_runs": {"state": "not_collected", "n": 5}, "avg_loc_per_function": {"n_used": 5, "n": 5, "state": "ok", "kind": "num", "value": 10.406, "sd": 1.4496827239089243}, "longest_function": {"n_used": 5, "n": 5, "state": "ok", "kind": "num", "value": 26.6, "sd": 4.219004621945797}, "cognitive_max": {"n_used": 5, "n": 5, "state": "ok", "kind": "num", "value": 6.6, "sd": 2.4083189157584592}, "mccabe_max": {"n_used": 5, "n": 5, "state": "ok", "kind": "num", "value": 5.4, "sd": 1.140175425099138}, "smell_total": {"n_used": 5, "n": 5, "state": "ok", "kind": "num", "value": 0.2, "sd": 0.4472135954999579}, "code_mass": {"n_used": 5, "n": 5, "state": "ok", "kind": "num", "value": 599.8, "sd": 59.51638429877944, "trophy": true}, "duration_seconds": {"n_used": 5, "n": 5, "state": "ok", "kind": "num", "value": 582.4, "sd": 66.40632499995765}, "total_tokens": {"n_used": 5, "n": 5, "state": "ok", "kind": "num", "value": 12589809.6, "sd": 1443210.2566401404}}}, {"key": "claim-office-example-mapping|external-kesseler-2026-09-30-cc|opus-5-no-thinking|", "labels": {"workflow": "external-kesseler-2026-09-30-cc"}, "n": 0, "span": null, "run_ids": [], "test_list": false, "values": {}}]}], "workflows": {"exact-hybrid-v2.4-lab-split-cc": {"description": "A variant of exact-hybrid-v2-testlist-fix-cc (arm: hybrid) that moves the lab infrastructure (autonomous-execution mandate, done marker, phase-continuation note) into a separate lab-only rules file and the refactor-subagent prompt contract into its own rules file. The agent-facing method is unchanged.", "arm": "hybrid", "status": "branch", "test_list": true}, "external-kesseler-2026-09-30-cc": {"description": "An external workflow for Claude Code (arm: kesseler): Lada Kesseler's TDD skill from lexler/skill-factory, commit 474433af2e (Apache-2.0), vendored unchanged together with its ZOMBIES reference; the upstream eval files are not included. Tests are planned up front as one-line test comments and checked for completeness against ZOMBIES. They are then worked through one at a time, with predicted failures, a two-step Red (first a compile failure, then an assertion failure), a simplify step and a refactor at every green. A final evaluation looks for missed tests and hardcoded values. Everything runs inline in one context. The lab runs the skill in its auto mode, treats the prompt as the approved plan and supplies the test command.", "arm": "kesseler", "status": "vendored", "test_list": false}, "external-pocock-2026-09-04-cc": {"description": "An external workflow for Claude Code (arm: pocock): the tdd, code-review and codebase-design skills from Matt Pocock's mattpocock/skills, commit 6654f6b6 (MIT), vendored unchanged. Red\u2013Green works in vertical slices, one test at a time, at seams agreed in advance. There is no up-front test list, and refactoring is explicitly not part of the loop. Once the suite is green, a code review runs in two parallel subagents, one for coding standards and one for the spec, and reports its findings without acting on them. The lab adds autonomous execution, takes the seams from the prompt, points the review at the written files and the prompt instead of a Git diff and an issue tracker, and supplies the test command.", "arm": "pocock", "status": "vendored", "test_list": false}, "external-superpowers-2026-09-04-cc": {"description": "An external workflow for Claude Code (arm: superpowers): the test-driven-development skill from Jesse Vincent's Superpowers collection, release v6.3.0 (MIT), vendored unchanged. Red\u2013Green\u2013Refactor under a strict test-first rule \u2014 code written before its test is deleted. No up-front test list; the next test is chosen as work proceeds, all inline in one context. The lab only replaces the human-in-the-loop checkpoints with autonomous execution.", "arm": "superpowers", "status": "vendored", "test_list": false}}}, "findings_md": "# Findings \u2014 RQ-4.7: Substituting the Inner TDD Loop (opus-5)\n\nAll figures: `claim-office-example-mapping` \u00d7 `opus-5-no-thinking` (native\nsubscription route), n=5 per cell. Both external workflows are vendored\nsnapshots at the commits named in [README.md](README.md); every statement here\ndescribes those snapshots, not the tools in general.\n\n## Overview\n\nPrimary outcome is Correctness (external); the decomposition metrics follow the\nbinding quality metric from RQ-architecture-axis-opus5 F-1.6.\n\n| Metric | `exact-hybrid-v2.4-lab-split-cc` (per-cycle, subagent) | `external-superpowers-2026-09-04-cc` (per-cycle, inline) | `external-pocock-2026-09-04-cc` (no refactor) |\n|---|---:|---:|---:|\n| **Correctness (external)** `verification_pct` \u2014 higher = better | 0.96 \u00b1 0.04 | **1.00 \u00b1 0.00** \ud83c\udfc6 | **1.00 \u00b1 0.00** \ud83c\udfc6 |\n| perfect runs | 2/5 | **5/5** \ud83c\udfc6 | **5/5** \ud83c\udfc6 |\n| Correctness (internal) `tests_passing` | **100 %** \ud83c\udfc6 | **100 %** \ud83c\udfc6 | **100 %** \ud83c\udfc6 |\n| `avg_loc_per_function` \u2014 lower = better | 4.49 \u00b1 0.54 | 7.90 \u00b1 1.15 | 10.41 \u00b1 1.45 |\n| `longest_function` \u2014 lower = better | 17.60 \u00b1 4.39 | 23.40 \u00b1 3.13 | 26.60 \u00b1 4.22 |\n| `cognitive_max` \u2014 lower = better | 2.80 \u00b1 0.84 | 6.20 \u00b1 2.17 | 6.60 \u00b1 2.41 |\n| `mccabe_max` \u2014 lower = better | 3.40 \u00b1 0.55 | 5.20 \u00b1 1.10 | 5.40 \u00b1 1.14 |\n| **Smell Total** \u2014 lower = better | 0.00 \u00b1 0.00 | **0.00 \u00b1 0.00** \ud83c\udfc6 | 0.20 \u00b1 0.45 |\n| **Code Mass (APP)** \u2014 lower = better | 821 \u00b1 111 | 666 \u00b1 26 | **600 \u00b1 60** \ud83c\udfc6 |\n| `duration_seconds` \u2014 lower = better | 3841 \u00b1 1523 | **548 \u00b1 57** \ud83c\udfc6 | **582 \u00b1 66** \ud83c\udfc6 |\n| `total_tokens` \u2014 lower = better | 140.9 M \u00b1 46 M | **12.2 M \u00b1 1.3 M** \ud83c\udfc6 | **12.6 M \u00b1 1.4 M** \ud83c\udfc6 |\n| `refactorings_applied` \u2014 design characteristic | 33.00 \u00b1 14.27 | 4.20 \u00b1 3.42 | 0.00 \u00b1 0.00 |\n| `test_blocks` | 48.40 \u00b1 2.07 | 13.40 \u00b1 2.51 | 19.00 \u00b1 2.74 |\n| `test_cases_total` | 49.00 \u00b1 2.00 | 45.00 \u00b1 11.51 | 36.80 \u00b1 5.26 |\n| `test_cases_first_block` | 1.00 \u00b1 0.00 | 1.00 \u00b1 0.00 | 1.00 \u00b1 0.00 |\n| `red_unverified` \u2014 lower = stricter | 0.00 \u00b1 0.00 | 1.00 \u00b1 1.73 | 0.20 \u00b1 0.45 |\n\n> **Why the quality rows carry no trophy.** The gating rule awards quality and\n> cost trophies only to cells at `verification_pct = 1.0`. `hybrid-v2.4` sits at\n> 0.96 with only 2/5 perfect runs \u2014 that is not a rounding remainder but a real\n> correctness shortfall in 3 of 5 runs. `hybrid-v2.4` is therefore not\n> trophy-eligible, yet it holds the best absolute values on all four\n> decomposition metrics. Awarding a trophy to the best *eligible* cell would put\n> it on the worse value of the row, which the convention excludes \u2014 so these rows\n> stay trophy-free. For cost, `Code Mass (APP)` and `Smell Total` the conflict\n> does not arise: there the best cell is eligible anyway.\n\n> `refactorings_applied` carries no trophy: the three values are the cells'\n> design characteristic, not a result. 33 / 4.2 / 0 is the axis itself.\n\n---\n\n## F-4.7.1 \u2014 The inner loop is substitutable without losing correctness\n\nBoth external workflows reach `verification_pct` 1.00 in 5/5 runs. The internal baseline `hybrid-v2.4` sits below that at 0.96 (2/5 perfect).\n\n| | perfect runs | `verification_pct` |\n|---|---:|---:|\n| `external-superpowers-2026-09-04-cc` | 5/5 | 1.00 \u00b1 0.00 |\n| `external-pocock-2026-09-04-cc` | 5/5 | 1.00 \u00b1 0.00 |\n| `exact-hybrid-v2.4-lab-split-cc` | 2/5 | 0.96 \u00b1 0.04 |\n\nReading: the value EXACT Coding adds lies in the example mapping and the test list, not in its own red/green plumbing. An externally authored loop carries the method on this kata at least as reliably. H5 confirmed for all three cells.\n\nThe three `hybrid-v2.4` runs at 0.9333 fail on the same acceptance-scenario pattern as the case documented in RQ-4.5 F-1.4; the effect is therefore not new, but it hits `hybrid-v2.4` more often than the two external cells.\n\n---\n\n## F-4.7.2 \u2014 Refactor position determines decomposition monotonically\n\nAcross the three cells all four decomposition and complexity metrics fall monotonically with refactor frequency.\n\n| | `refactorings_applied` | `avg_loc_per_function` | `longest_function` | `cognitive_max` | `mccabe_max` |\n|---|---:|---:|---:|---:|---:|\n| `hybrid-v2.4` per-cycle, subagent | 33.00 | 4.49 | 17.60 | 2.80 | 3.40 |\n| `superpowers-2026-09-04` per-cycle, inline | 4.20 | 7.90 | 23.40 | 6.20 | 5.20 |\n| `pocock-2026-09-04` no refactor | 0.00 | 10.41 | 26.60 | 6.60 | 5.40 |\n\nThe clean test of position is `superpowers-2026-09-04 \u2194 pocock-2026-09-04` \u2014 same architecture (one inline skill), only the position varies. `avg_loc_per_function` 7.90 against 10.41 is the most robust single result of this pair (gap 2.51 at \u03c3 \u2248 1.3). `longest_function`, `cognitive_max` and `mccabe_max` point the same way but sit within 1 \u03c3.\n\nH1 confirmed: a refactor stage has an effect. H2 confirmed: `pocock-2026-09-04` is the field's quality minimum on all four metrics. The design doctrine in the prompt (\"deep modules\", \"small interfaces\") does not replace the stage.\n\n---\n\n## F-4.7.3 \u2014 The isolated subagent architecture buys decomposition, and it is expensive\n\n`hybrid-v2.4 \u2194 superpowers-2026-09-04` varies architecture and mechanism at constant position (both refactor per cycle). The difference is large in both directions.\n\n| | `avg_loc_per_function` | `duration_seconds` | `total_tokens` | `refactorings_applied` |\n|---|---:|---:|---:|---:|\n| `hybrid-v2.4` phase commands + subagent | 4.49 \u00b1 0.54 | 3841 \u00b1 1523 | 140.9 M \u00b1 46 M | 33.00 \u00b1 14.27 |\n| `superpowers-2026-09-04` one inline skill | 7.90 \u00b1 1.15 | 548 \u00b1 57 | 12.2 M \u00b1 1.3 M | 4.20 \u00b1 3.42 |\n| Factor | 0.57\u00d7 | **7.0\u00d7** | **11.6\u00d7** | 7.9\u00d7 |\n\nThe answer to the RQ's guiding question is therefore twofold: the subagent apparatus **does buy** measurably better decomposition (4.49 against 7.90, \u2248 3 \u03c3) \u2014 but at the price of 7\u00d7 wallclock and 10\u00d7 tokens, with worse Correctness (external) at the same time. H3 in the variant \"per-cycle refactoring alone suffices\" is refuted: `superpowers-2026-09-04` refactors per cycle and still lands clearly outside the `hybrid-v2.4` level. H4 confirmed (`superpowers-2026-09-04` markedly cheaper than `hybrid-v2.4`).\n\nThe \u03c3 values are part of the result: relative to its mean, `hybrid-v2.4` spreads three to four times wider on duration (\u00b1 1523 s) and tokens (\u00b1 42 M) than `superpowers-2026-09-04`. The apparatus is not only more expensive, its cost is also less predictable.\n\n---\n\n## F-4.7.4 \u2014 The review stage costs more than the missing refactor saves\n\n`pocock-2026-09-04` has no refactor stage, but two review subagents at the end. It is still not the cheapest cell.\n\n| | `duration_seconds` | `total_tokens` |\n|---|---:|---:|\n| `superpowers-2026-09-04` per-cycle refactor, no review | **548 \u00b1 57** | **12.2 M \u00b1 1.3 M** |\n| `pocock-2026-09-04` no refactor, two review subagents | 582 \u00b1 66 | 12.6 M \u00b1 1.4 M |\n\nH8 (`pocock-2026-09-04` is the cheapest cell) is **not confirmed**: `pocock-2026-09-04` sits above `superpowers-2026-09-04` on both wallclock and tokens, both gaps within 1 \u03c3. Reading: the two review subagents cost about as much as the saved per-cycle refactoring yields \u2014 and deliver no code, because by construction they only report.\n\nThe token row is the one this RQ had to re-measure: `pocock-2026-09-04` spends its review budget inside two subagents, and until 2026-09-30 subagent tokens were absent from `total_tokens` entirely (RQ-old-vs-new-exact-line-opus55 F-4.12.5). On the uncorrected figure this cell read 11.8 M and undercut `superpowers-2026-09-04`, which is the one arrangement of the numbers that would have argued against this finding. Dropping the review stage would give the cheapest variant of the field; with it, `pocock-2026-09-04` is cost-neutral against `superpowers-2026-09-04` and worse on every quality metric.\n\n---\n\n## F-4.7.5 \u2014 Superpowers keeps cycle discipline but does not write tests in one block\n\nThe manual n=1 observation that Superpowers writes all tests at once does not reproduce.\n\n| | `test_blocks` | `test_cases_total` | `test_cases_first_block` | cases per block |\n|---|---:|---:|---:|---:|\n| `hybrid-v2.4` | 48.40 \u00b1 2.07 | 49.00 \u00b1 2.00 | 1.00 \u00b1 0.00 | 1.01 |\n| `superpowers-2026-09-04` | 13.40 \u00b1 2.51 | 45.00 \u00b1 11.51 | 1.00 \u00b1 0.00 | 3.36 |\n| `pocock-2026-09-04` | 19.00 \u00b1 2.74 | 36.80 \u00b1 5.26 | 1.00 \u00b1 0.00 | 1.94 |\n\n`test_cases_first_block` is exactly 1 in 15/15 runs: no workflow starts with a test block. H6 is therefore **refuted** \u2014 the falsifier (`test_blocks = 1` or first block \u2248 total count) occurs in no run.\n\nThe step size nevertheless differs clearly: `hybrid-v2.4` stays at one case per block, `superpowers-2026-09-04` writes 3.36 on average. The skill's script demands \"one behavior\" per test; `superpowers-2026-09-04` reads that noticeably more broadly than the phase commands, without skipping the red phase.\n\n`red_unverified` stays low but not at zero: `hybrid-v2.4` 0.00, `pocock-2026-09-04` 0.20 \u00b1 0.45, `superpowers-2026-09-04` 1.00 \u00b1 1.73. The spread at `superpowers-2026-09-04` comes from a single run; H7 holds for `hybrid-v2.4` and `pocock-2026-09-04` and is only weakly supported for `superpowers-2026-09-04`.\n\n---\n\n## F-4.7.6 \u2014 Little code is not a quality signal here\n\nThe Code Mass ordering runs opposite to the complexity ordering.\n\n| | Code Mass (APP) | `avg_loc_per_function` |\n|---|---:|---:|\n| `hybrid-v2.4` | 821 \u00b1 111 | 4.49 |\n| `superpowers-2026-09-04` | 666 \u00b1 26 | 7.90 |\n| `pocock-2026-09-04` | 600 \u00b1 60 | 10.41 |\n\n`pocock-2026-09-04` writes the least and packs it into the longest, most complex functions; `hybrid-v2.4` writes the most and distributes it most finely. Consequence for the analysis: on this kata Code Mass (APP) alone does not separate \"parsimonious\" from \"compacted\". Without the decomposition metrics next to it, `pocock-2026-09-04` would read as the leaner result \u2014 it is the unstructured one.\n"}, {"id": "RQ-tcr-variants-opus5", "question": "How do classic TCR and TCRDD variants affect correctness, code quality, development behavior, and efficiency in autonomous coding agents, and\u2014within TCRDD\u2014does tool-enforced execution with git-gamble differ from native-Git prompt enforcement?", "subtree": "questions-claude", "chapter": "4.8", "dir": "research/questions-claude/4.8-tcr-variants-opus5", "closed": null, "cells": 4, "cells_full": 4, "runs": 18, "span": ["2026-09-14", "2026-09-14"], "min_replicates": 4, "katas": ["claim-office-example-mapping"]}, {"id": "RQ-current-ptdd-vs-exact-opus-native", "question": "On native Opus 5, how does the current SOL Predictive-TDD workflow compare with the default EXACT Coding workflow on correctness, decomposition, development behavior, and efficiency?", "subtree": "questions-claude", "chapter": "4.9", "dir": "research/questions-claude/4.9-current-ptdd-vs-exact-opus-native", "closed": null, "cells": 2, "cells_full": 2, "runs": 28, "span": ["2026-08-10", "2026-09-16"], "min_replicates": 5, "katas": ["claim-office-example-mapping"]}, {"id": "RQ-stability", "question": "How stable are code quality and TDD discipline per workflow across replicates, and under which conditions is n=3 a sufficient replicate count?", "subtree": "questions-claude", "chapter": "5.1", "dir": "research/questions-claude/5.1-workflow-stability", "closed": "gap accepted \u2014 one game-of-life cell holds 9 of 10 runs", "cells": 6, "cells_full": 5, "runs": 59, "span": ["2026-05-14", "2026-05-15"], "min_replicates": 10, "katas": ["game-of-life-example-mapping", "game-of-life-prose"]}, {"id": "RQ-exact-coding-typescript", "question": "On TypeScript with Vitest, how do inline TDD, shared-context EXACT Coding Predictive TDD, and EXACT Coding with an isolated Refactor subagent compare on correctness and code quality for GPT-5.6 SOL and Opus 5?", "subtree": "questions-cross", "chapter": "1.10", "dir": "research/questions-cross/1.10-exact-coding-typescript", "closed": null, "cells": 6, "cells_full": 6, "runs": 60, "span": ["2026-09-14", "2026-10-01"], "min_replicates": 5, "katas": ["claim-office-example-mapping"]}, {"id": "RQ-exact-coding-rust", "question": "On Rust with Cargo, how do inline TDD, shared-context EXACT Coding Predictive TDD, and EXACT Coding with an isolated Refactor subagent compare on corr n_replicates": 5, "katas": ["claim-office-example-mapping"]}, {"id": "RQ-exact-coding-java", "question": "On Java 17 with JUnit 5 and Maven, how do inline TDD, shared-context EXACT Coding Predictive TDD, and EXACT Coding with an isolated Refactor subagent compare on correctness and code quality for GPT-5.6 SOL and Opus 5?", "subtree": "questions-cross", "chapter": "1.8", "dir": "research/questions-cross/1.8-exact-coding-java", "closed": null, "cells": 12, "cells_full": 12, "runs": 60, "span": ["2026-09-20", "2026-09-20"], "min_replicates": 5, "katas": ["claim-office-java-example-mapping", "game-of-life-java-example-mapping"]}, {"id": "RQ-exact-coding-python", "question": "On Python with pytest, how do inline TDD, shared-context EXACT Coding Predictive TDD, and EXACT Coding with an isolated Refactor subagent compare on correctness and code quality for GPT-5.6 SOL and Opus 5?", "subtree": "questions-cross", "chapter": "1.9", "dir": "research/questions-cross/1.9-exact-coding-python", "closed": null, "cells": 12, "cells_full": 12, "runs": 65, "span": ["2026-09-21", "2026-09-22"], "min_replicates": 5, "katas": ["claim-office-python-example-mapping", "game-of-life-python-example-mapping"]}, {"id": "RQ-model-quality-cursor", "question": "How do the models reachable via the cursor-cli harness (Opus 4.8 medium, Composer 2.5, Grok 4.5 medium) differ in code quality and TDD discipline on game-of-life-example-mapping?", "subtree": "questions-cursor-cli", "chapter": "1.1", "dir": "research/questions-cursor-cli/1.1-model-quality-cursor", "closed": "deprecated \u2014 cursor-cli line dropped, opus-cursor cell never filled", "cells": 3, "cells_full": 2, "runs": 10, "span": ["2026-07-28", "2026-07-28"], "min_replicates": 5, "katas": ["game-of-life-example-mapping"]}, {"id": "RQ-model-quality-oc", "question": "How do five models reachable via the OpenCode harness (Opus 4.7 via Portkey + four non-Anthropic models from the Portkey catalog) differ in code quality and TDD discipline on ga  GPT-5.6 Sol on the two native Sol workflows \u2014 does the smaller, cheaper-tier model hold correctness and code quality, or does it only look competitive because the workflow carries it?", "subtree": "questions-pi", "chapter": "1.4", "dir": "research/questions-pi/1.4-spark-vs-sol", "closed": null, "cells": 4, "cells_full": 4, "runs": 20, "span": ["2026-08-16", "2026-08-17"], "min_replicates": 5, "katas": ["sphinx-score-example-mapping"]}, {"id": "RQ-astra-pi", "question": "On the OpenAI subscription route, how does GPT-6 Astra compare to the strongest references reachable on the pi harness \u2014 Sol on the same route, Sol on Requesty in both reasoning states, and Opus 5 on Requesty \u2014 at constant harness, workflow, kata and prompt style?", "subtree": "questions-pi", "chapter": "1.5", "dir": "research/questions-pi/1.5-astra-vs-pi-references", "closed": null, "cells": 5, "cells_full": 5, "runs": 25, "span": ["2026-08-05", "2026-09-05"], "min_replicates": 5, "katas": ["game-of-life-example-mapping"]}, {"id": "RQ-astra-native-sol", "question": "Does the natively-built Sol workflow line (basic-sol-tdd, Predictive TDD) transfer to GPT-6 Astra \u2014 or is its advantage over the Opus-derived EXACT line a property of Sol?", "subtree": "questions-pi", "chapter": "1.6", "dir": "research/questions-pi/1.6-astra-native-sol-line", "closed": null, "cells": 8, "cells_full": 8, "runs": 40, "span": ["2026-08-16", "2026-09-13"], "min_replicates": 5, "katas": ["claim-office-example-mapping"]}, {"id": "RQ-tcr-variants-sol", "question": "How do first-party EXACT Coding TCR, classic TCR, and external TCRDD variants affect correctness, code quality, development behavior, and efficiency for SOL on pi, and how do their native-Git and tool-enforced execution strategies differ?", "subtree": "questions-pi", "chapter": "1.7", "dir": "research/questions-pi/1.7-tcr-variants-sol", "closed": null, "cells": 6, "cells_full": 6, "runs": 30, "span": ["2026-09-14", "2026-09-14"], "min_replicates": 5, "katas": ["claim-office-example-mapping"]}, {"id": "RQ-test-list-dimensions-sol-pi", "question": "On GPT-5.6 SOL via pi, does the independent-dimensions test-list cross-check improve the current SOL PTDD default's external completeness without sacrificing its efficiency or product quality?", "subtree": "questions-pi", "chapter": "1.8", "dir": "research/questions-pi/1.8-test-list-dimensions-sol-pi", "closed": null, "cells": 2, "cells_full": 2, "runs": 20, "span": ["2026-09-15", "2026-09-16"], "min_replicates": 5, "katas": ["claim-office-example-mapping"]}, {"id": "RQ-test-list-dimensions-multikata-sol-pi", "question": "Across Game of Life and Sphinx Score on GPT-5.6 SOL/pi, does the v1.6 independent-dimensions test-list cross-check justify its overhead relative to the v1.5 SOL default?", "subtree": "questions-pi", "chapter": "1.9", "dir": "research/questions-pi/1.9-test-list-dimensions-multikata-sol-pi", "closed": null, "cells": 4, "cells_full": 4, "runs": 20, "span": ["2026-09-16", "2026-09-16"], "min_replicates": 5, "katas": ["game-of-life-example-mapping", "sphinx-score-example-mapping"]}]}</script>
<script>
const DATA = JSON.parse(document.getElementById("data").textContent);
const h = React.createElement, { useState, useEffect, useMemo } = React;
const REG = DATA.registry;
const GH = "https://github.com/marcoemrich/agentic_coding_lab/tree/main/";
const SUBTREES = [
  ["questions-claude", "Claude Code"], ["questions-pi", "pi"], ["questions-opencode", "OpenCode"],
  ["questions-cursor-cli", "Cursor CLI"], ["questions-cross", "Across harnesses"]];
const DIR = { higher: "↑", lower: "↓", informative: "○" };
const DIR_TXT = { higher: "higher is better", lower: "lower is better", informative: "informative, no winner" };

function useHash() {
  const [hash, set] = useState(location.hash.slice(1));
  useEffect(() => { const f = () => { set(location.hash.slice(1)); window.scrollTo(0, 0); }; addEventListener("hashchange", f); return () => removeEventListener("hashchange", f); }, []);
  return hash;
}

function fmtNum(x, unit) {
  if (x == null) return "";
  if (unit === "%") return Math.round(x * 100) + "%";
  if (unit === "USD") return "$" + x.toFixed(2);
  if (unit === "tokens") return x >= 1e6 ? (x / 1e6).toFixed(1) + "M" : Math.round(x / 1e3) + "k";
  const a = Math.abs(x);
  const d = a >= 100 ? 0 : a >= 10 ? 1 : 2;
  return x.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
}
function fmtSd(x, unit) {
  if (x == null) return null;
  if (unit === "%") return Math.round(x * 100);
  if (unit === "USD") return x.toFixed(2);
  if (unit === "tokens") return x >= 1e6 ? (x / 1e6).toFixed(1) + "M" : Math.round(x / 1e3) + "k";
  return fmtNum(x, "");
}
const span = s => !s ? "" : s[0] === s[1] ? s[0] : s[0] + " → " + (s[0].slice(0, 4) === s[1].slice(0, 4) ? s[1].slice(5) : s[1]);

function Cell({ v, unit, gstart }) {
  const cls = [gstart ? "gstart" : ""];
  if (!v || v.state === "not_collected")
    return h("td", { className: cls.concat("nc").join(" "), title: "Not collected: no run in this cell has this metric (not measured at the time)." }, "n/c");
  let main, sub = null;
  if (v.kind === "bool") { main = Math.round(v.value * 100) + "%"; sub = v.k + "/" + v.n_used; }
  else if (v.kind === "rate") { main = Math.round(v.value * 100) + "%"; sub = v.k + "/" + v.t; }
  else { main = fmtNum(v.value, unit); const s = fmtSd(v.sd, unit); if (s != null) main = [main, h("span", { className: "sd", key: "s" }, " ± " + s)]; }
  if (v.state === "partial") sub = (sub ? sub + ", " : "") + "n=" + v.n_used + "/" + v.n;
  if (v.trophy) cls.push("win");
  const title = v.state === "partial" ? `Partial: only ${v.n_used} of ${v.n} runs carry this metric.` : v.gated ? "No trophy: cell is below 90% external correctness." : undefined;
  return h("td", { className: cls.join(" "), title }, main, v.trophy ? " 🏆" : null, sub ? h("span", { className: "sub" }, sub) : null);
}

function ResultTable({ table, d, rq }) {
  const outs = d.outcomes;
  const [sort, setSort] = useState(null);
  const rows = useMemo(() => {
    const r = table.rows.slice();
    if (!sort) return r;
    const dir = REG[sort.o].direction === "lower" ? 1 : -1;
    return r.sort((a, b) => {
      const x = a.values[sort.o]?.value, y = b.values[sort.o]?.value;
      if (x == null) return 1; if (y == null) return -1;
      return sort.flip ? (x - y) * -dir : (x - y) * dir;
    });
  }, [table, sort]);
  const groups = [];
  outs.forEach((o, i) => { const g = REG[o].group; if (!groups.length || groups[groups.length - 1].g !== g) groups.push({ g, n: 1, i }); else groups[groups.length - 1].n++; });
  const gstarts = new Set(groups.map(g => g.i));
  const label = r => d.varying.map(k => {
    const val = r.labels[k];
    if (k === "workflow") return h("span", { key: k }, h("a", { href: "#workflows" }, val),
      r.test_list != null ? h("span", { className: "tag", title: r.test_list ? "Writes a test list up front" : "Picks the next test ad hoc" }, r.test_list ? "test list" : "ad hoc") : null);
    return h("span", { key: k }, k + ": " + val);
  });
  return h("div", null,
    h("div", { className: "scroll" },
      h("table", { className: "res" },
        h("thead", null,
          h("tr", { className: "groups" }, h("th", { className: "lab", rowSpan: 2 }, d.varying.join(" × "), h("span", { className: "sub" }, "n, run dates")),
            groups.map(g => h("th", { key: g.g, colSpan: g.n }, g.g))),
          h("tr", { className: "cols" }, outs.map((o, i) => {
            const m = REG[o]; const warn = m.flags.includes("testlist");
            const suppressed = warn && d.spans_test_list_boundary;
            return h("th", { key: o, tabIndex: 0, className: gstarts.has(i) ? "gstart" : "",
              title: `${o}\n${DIR_TXT[m.direction]}${warn ? "\nNot comparable across the test-list boundary: a skipped test is compliance in a test-list workflow and a violation in an ad-hoc one." + (suppressed ? " This RQ spans the boundary, so no trophy." : "") : ""}\nClick to sort.`,
              onClick: () => setSort(s => s && s.o === o ? { o, flip: !s.flip } : { o }),
              onKeyDown: e => { if (e.key === "Enter") setSort(s => s && s.o === o ? { o, flip: !s.flip } : { o }); } },
              m.name, h("span", { className: "dir" }, DIR[m.direction]), warn ? h("span", { className: "warnmark" }, " ⚠") : null);
          }))),
        h("tbody", null, rows.map(r => r.n === 0
          ? h("tr", { key: r.key, className: "notrun" }, h("td", { className: "lab" }, label(r), h("span", { className: "sub" }, "0 runs")),
              h("td", { colSpan: outs.length, style: { textAlign: "left" }, title: "Declared in the RQ, never run." }, "Not run"))
          : h("tr", { key: r.key },
              h("td", { className: "lab" }, label(r), h("span", { className: "sub" }, `n = ${r.n}, ${span(r.span)}`)),
              outs.map((o, i) => h(Cell, { key: o, v: r.values[o], unit: REG[o].unit, gstart: gstarts.has(i) }))))))),
    h("details", { className: "runs" }, h("summary", null, "Runs behind each row"),
      table.rows.filter(r => r.n).map(r => h("div", { key: r.key }, h("h3", null, Object.values(r.labels).join(" × ")),
        h("ul", null, r.run_ids.map(id => h("li", { key: id }, h("a", { href: GH + "experiments/runs/" + id }, id))))))));
}

function RQPage({ rq }) {
  const d = rq.detail;
  const controls = Object.entries(d.controls).map(([k, v]) => k + ": " + (typeof v === "object" ? JSON.stringify(v) : v)).join(", ");
  return h("article", null,
    h("div", { className: "rqid" }, rq.id),
    h("h1", { className: "q" }, rq.question),
    rq.closed ? h("div", { className: "banner closed" }, h("strong", null, "Closed. "), rq.closed) : null,
    h("dl", { className: "meta" },
      h("dt", null, "Varies"), h("dd", null, d.varying.join(", ")),
      h("dt", null, "Held fixed"), h("dd", null, controls),
      h("dt", null, "Runs"), h("dd", null, `${rq.runs} runs, ${span(rq.span)}; ${rq.cells_full} of ${rq.cells} cells at ${rq.min_replicates} replicates`),
      h("dt", null, "Source"), h("dd", null, h("a", { href: GH + rq.dir }, rq.dir))),
    d.spans_test_list_boundary ? h("div", { className: "banner warn" }, "⚠ This RQ compares test-list and ad-hoc workflows. Columns marked ⚠ measure the architecture as much as the discipline, so they get no trophy here.") : null,
    d.tables.map(t => h("section", { key: t.kata },
      h("h2", null, t.kata),
      h("div", { className: "legend" },
        h("span", null, "↑ higher is better"), h("span", null, "↓ lower is better"), h("span", null, "○ informative"),
        h("span", null, "🏆 best in column"), h("span", null, "value ± sd"), h("span", null, "n/c not collected"),
        h("span", null, "Code quality and cost trophies need ≥ 90% external correctness")),
      h(ResultTable, { table: t, d, rq }))),
    rq.findings_md ? h("details", { className: "find" },
      h("summary", null, "Findings and hypotheses"),
      h("div", { className: "banner warn", style: { marginTop: 12 } }, "AI-generated, not human-validated. Read the table above first."),
      h("div", { className: "md", dangerouslySetInnerHTML: { __html: marked.parse(rq.findings_md) } })) : null);
}

function Index() {
  return h("div", { className: "index" },
    h("h1", { className: "q" }, "What the lab measured, one research question at a time"),
    h("p", { style: { maxWidth: "70ch", color: "var(--ink-2)", marginTop: 0 } },
      "Each question fixes some factors, varies others, and runs coding agents against a kata until every cell has enough replicates. The tables are computed from the runs; the findings below them are AI-generated."),
    SUBTREES.map(([key, title]) => {
      const list = DATA.rqs.filter(r => r.subtree === key);
      if (!list.length) return null;
      return h("section", { className: "group", key },
        h("h2", null, title),
        h("ul", { className: "rqs" }, list.map(r => h("li", { key: r.id },
          h("span", { className: "ch" }, r.chapter),
          h("div", { className: "qt" },
            r.detail ? h("a", { href: "#" + r.id }, r.question) : h("span", { className: "t" }, r.question),
            h("span", { className: "sub" }, r.id, r.closed ? h("span", { className: "tag" }, "closed") : null, !r.detail && r.runs ? h("span", { className: "tag" }, "page not in prototype") : null)),
          h("div", { className: "facts" }, r.runs ? [`${r.cells_full}/${r.cells} cells`, h("br", { key: "b" }), span(r.span)] : "no data yet")))));
    }));
}

function Workflows() {
  const all = {};
  DATA.rqs.filter(r => r.detail).forEach(r => Object.assign(all, r.detail.workflows));
  return h("div", { className: "wfs" },
    h("h1", { className: "q" }, "Workflows"),
    h("p", { style: { maxWidth: "70ch", color: "var(--ink-2)", marginTop: 0 } }, "Every workflow that appears in a table. In the prototype: the workflows of the two sample questions."),
    Object.entries(all).sort().map(([name, w]) => h("div", { className: "wf", id: "wf-" + name, key: name },
      h("h3", null, name, w.arm ? h("span", { className: "tag" }, w.arm) : null, w.test_list != null ? h("span", { className: "tag" }, w.test_list ? "test list" : "ad hoc") : null, w.status ? h("span", { className: "tag" }, w.status) : null),
      h("p", null, w.description || "No description yet."))));
}

function App() {
  const hash = useHash();
  const rq = DATA.rqs.find(r => r.id === hash && r.detail);
  const page = hash === "workflows" ? "workflows" : rq ? "rq" : "index";
  return h("div", { className: "wrap" },
    h("header", { className: "top" },
      h("a", { className: "name", href: "#" }, "Agentic Coding Lab"),
      h("nav", null,
        h("a", { href: "#", "aria-current": page === "index" ? "page" : undefined }, "Questions"),
        h("a", { href: "#workflows", "aria-current": page === "workflows" ? "page" : undefined }, "Workflows")),
      h("span", { className: "stamp" }, `Data as of ${DATA.generated.replace("T", " ")}, ${DATA.pool_size} runs`)),
    h("div", { className: "proto" }, "Prototype. Two questions have full pages; the rest of the index is real but not linked yet."),
    page === "rq" ? h(RQPage, { rq }) : page === "workflows" ? h(Workflows) : h(Index));
}
ReactDOM.createRoot(document.getElementById("app")).render(h(App));
</script>
